# Stessi pin e stesso schema "evento A / evento B" del firmware precedente.
binary_sensor:
  - platform: gpio
    id: pc_encoder_a
    internal: true
    pin:
      number: ${encoder_a}
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - script.execute:
            id: pc_rotate
            delta: 1
  - platform: gpio
    id: pc_encoder_b
    internal: true
    pin:
      number: ${encoder_b}
      mode:
        input: true
        pullup: true
    on_press:
      then:
        - script.execute:
            id: pc_rotate
            delta: -1

script:
  # 5 s: usa SOLO il valore Altri calcolato nell'originale pc_refresh.
  # Una richiesta viene fatta solo dopo due misure abbastanza stabili.
  - id: pc_learn_tick
    mode: single
    then:
      - lambda: |-
          const uint32_t now=millis();
          id(pc_learn_new_prompt)=false;
          if (id(pc_ota) || id(pc_boot_active) || !id(pc_learn_enabled).state ||
              !id(pc_wifi).is_connected() ||
              !id(pc_api).is_connected_with_state_subscription() ||
              id(pc_auto_last_power_data_ms)==0 ||
              (uint32_t)(now-id(pc_auto_last_power_data_ms))>20000u ||
              !std::isfinite(id(pc_other_w).state)) {
            id(pc_learn_streak)=0;
            id(pc_learn_base_ready)=false;
            return;
          }
          const float w=id(pc_other_w).state;
          if (w<0.0f) return;
          if (id(pc_learn_pending)) {
            // La domanda non sparisce se il forno disattiva la resistenza.
            return;
          }
          // L'aggiornamento dei dati totali e' l'unica sorgente di freschezza.
          if (id(pc_learn_last_sample_ms)==id(pc_auto_last_power_data_ms)) return;
          id(pc_learn_last_sample_ms)=id(pc_auto_last_power_data_ms);
          if (!id(pc_learn_base_ready)) {
            id(pc_learn_base)=w;
            id(pc_learn_base_ready)=true;
            return;  // Mai creare una domanda sulla prima misura dopo il boot.
          }
          if (id(pc_auto_mode)==2 || id(pc_page)==5 || id(pc_page)==6 ||
              !(id(pc_page)==0 || id(pc_page)==2)) return;
          const float threshold=(float)id(pc_learn_min_rise_w);
          const float delta=w-id(pc_learn_base);
          if (delta<threshold) {
            id(pc_learn_streak)=0;
            // Rientro rapido sul carico di base; adattamento lento al rumore.
            if (w<id(pc_learn_base)-25.0f) id(pc_learn_base)=w;
            else id(pc_learn_base)=0.85f*id(pc_learn_base)+0.15f*w;
            return;
          }
          if ((int32_t)(now-id(pc_learn_cooldown_until_ms))<0) return;
          if (id(pc_learn_streak)==0) {
            id(pc_learn_streak)=1;
            id(pc_learn_first_delta)=delta;
            return;
          }
          if (fabsf(delta-id(pc_learn_first_delta)) >
              fmaxf((float)${learning_stability_w},0.18f*id(pc_learn_first_delta))) {
            id(pc_learn_first_delta)=delta;
            id(pc_learn_streak)=1;
            return;
          }
          // Per piccoli carichi (luci, standby) richiedi tre misure coerenti.
          // Per carichi >=100 W mantieni le due misure della versione precedente.
          id(pc_learn_streak)++;
          if (delta<100.0f && id(pc_learn_streak)<3) return;
          id(pc_learn_streak)=0;
          id(pc_learn_candidate_w)=delta;
          const float tolerance=fmaxf(12.0f,fminf(50.0f,0.10f*delta));
          // Il vecchio profilo generico 'Altro' non deve bloccare l'apprendimento
          // di una luce o di un diverso elettrodomestico con potenza simile.
          // Per i profili specifici il filtro riduce le ripetizioni dei cicli,
          // ma due apparecchi con identica potenza rimangono indistinguibili.
          if (id(pc_learn_last_key)!=0 && id(pc_learn_last_key)/100!=10 &&
              id(pc_learn_last_confirm_ms)!=0 &&
              (uint32_t)(now-id(pc_learn_last_confirm_ms))<7200000u &&
              fabsf(delta-id(pc_learn_last_confirm_w))<tolerance) {
            id(pc_learn_base)=w;
            id(pc_learn_cooldown_until_ms)=now+60000u;
            return;
          }
          // Riconoscimento conservativo: almeno tre conferme, UN SOLO profilo
          // compatibile; in caso di ambiguita' la domanda viene mostrata.
          int matching=0, matched=-1;
          for (int i=0;i<32;i++) {
            if (id(pc_learn_keys)[i]==0 || id(pc_learn_counts)[i]<3 ||
                id(pc_learn_keys)[i]/100==10) continue; // Mai riconoscere 'Altro'.
            const float mean=id(pc_learn_means)[i];
            if (fabsf(mean-delta)<=fmaxf(12.0f,fminf(75.0f,0.12f*mean))) {
              matching++;
              matched=i;
            }
          }
          if (matching==1) {
            static const char *const n[11]={"Microonde","Piano induzione",
              "Forno grande","Caldaia","Purificatore 1","Purificatore 2",
              "Ferro da stiro","Deumidificatore 1","Deumidificatore 2","Altro",
              "Illuminazione"};
            const int key=id(pc_learn_keys)[matched];
            const int dev=key/100-1;
            char msg[110];
            snprintf(msg,sizeof(msg),"Probabile %s (+%.0f W; modalita %d)",
              dev>=0 && dev<11?n[dev]:"carico",delta,key%100);
            id(pc_learn_status).publish_state(msg);
            id(pc_learn_base)=w;
            id(pc_learn_cooldown_until_ms)=now+((uint32_t)${learning_cooldown_s})*1000u;
            return;
          }
          id(pc_learn_pending)=true;
          id(pc_learn_new_prompt)=true;
          id(pc_learn_since_ms)=now;
          id(pc_learn_device_idx)=0;
          id(pc_learn_mode_idx)=0;
          id(pc_learn_mode_count)=7;
          id(pc_learn_edit_stage)=0;
          id(pc_last_activity_ms)=now;
      - if:
          condition:
            lambda: 'return id(pc_learn_new_prompt) && id(pc_learn_pending) && !id(pc_ota) && id(pc_auto_mode)!=2;'
          then:
            - script.execute: pc_learn_draw
            - lvgl.page.show:
                id: pc_learn_page
                animation: NONE
            - drv2605.play_effect:
                id: pc_haptic_driver
                effect: 7
            - delay: 180ms
            - drv2605.play_effect:
                id: pc_haptic_driver
                effect: 7
            - lambda: 'id(pc_learn_new_prompt)=false;'

  # Unica tabella delle modalita': aggiorna titolo, modalita', selezione e W.
  - id: pc_learn_draw
    mode: restart
    then:
      - lambda: |-
          if (!id(pc_learn_pending) || id(pc_ota)) return;
          // Appendere in coda: l'indice di 'Altro' (key 1001) rimane invariato
          // per non reinterpretare i profili gia' salvati in memoria.
          static const char *const devices[11]={
            "Microonde","Piano induzione","Forno grande","Caldaia",
            "Purificatore","Tenda da Sole","Ferro da stiro",
            "Tapparella","Deumidificatore","Illuminazione","Altro"};
          static const char *const opts[11][24]={
            {"Jet / Massima","750 W","650 W","500 W","350 W","160 W","90 W"},
            {"Livello 1","Livello 2","Livello 3","Livello 4","Livello 5",
             "Livello 6","Livello 7","Livello 8","Livello 9"},
            {"Statico 100 C","Statico 120 C","Statico 140 C","Statico 160 C",
             "Statico 180 C","Statico 200 C","Statico 220 C","Statico 240 C",
             "Ventilato 160 C","Ventilato 180 C","Ventilato 200 C","Ventilato 220 C",
             "Grill","Altro"},
            {"Riscaldamento","Acqua calda","Standby","Altro"},
            {"Auto","Velocita 1","Velocita 2","Velocita 3","Massima"},
            {"Apertura","Chiusura"},
            {"Temp. bassa","Temp. media","Temp. alta","Vapore"},
            {"Apertura","Chiusura"},
            {"Auto","Continuo","Velocita bassa","Velocita alta"},
            {"Cameretta","Camera","Sala","Cucina","Bagno","Ingresso","Altro"},
            {"Altro non elencato"},
          };
          const int dev=std::max(0,std::min(10,id(pc_learn_device_idx)));
          int n=0;
          while(n<24 && opts[dev][n]!=nullptr) n++;
          id(pc_learn_mode_count)=std::max(1,n);
          if (id(pc_learn_mode_idx)>=id(pc_learn_mode_count)) id(pc_learn_mode_idx)=0;
          char watts[40];
          snprintf(watts,sizeof(watts),"+%.0f W",id(pc_learn_candidate_w));
          lv_label_set_text(id(pc_learn_watt_label),watts);
          lv_label_set_text(id(pc_learn_device_label),devices[dev]);
          lv_label_set_text(id(pc_learn_mode_label),opts[dev][id(pc_learn_mode_idx)]);
          lv_obj_set_style_border_color(id(pc_learn_device_btn),
            lv_color_hex(id(pc_learn_edit_stage)==0?0x38BDF8:0x334155),LV_PART_MAIN);
          lv_obj_set_style_border_color(id(pc_learn_mode_btn),
            lv_color_hex(id(pc_learn_edit_stage)==1?0x38BDF8:0x334155),LV_PART_MAIN);

  - id: pc_learn_close
    mode: restart
    then:
      - lambda: |-
          id(pc_learn_pending)=false;
          id(pc_learn_streak)=0;
          id(pc_learn_base)=std::isfinite(id(pc_other_w).state)
            ? id(pc_other_w).state : id(pc_learn_base);
          id(pc_learn_base_ready)=std::isfinite(id(pc_other_w).state);
          id(pc_learn_cooldown_until_ms)=millis()+((uint32_t)${learning_cooldown_s})*1000u;
          id(pc_page)=0;
          id(pc_home_selection_explicit)=false;
          id(pc_last_activity_ms)=millis();
          id(pc_dirty)=true;
      - if:
          condition:
            lambda: 'return !id(pc_ota) && !id(pc_auto_overlay_open) && id(pc_auto_mode)!=2;'
          then:
            - lvgl.page.show:
                id: power_page
                animation: NONE
            - script.execute: pc_refresh

  - id: pc_learn_confirm
    mode: single
    then:
      - lambda: |-
          if (!id(pc_learn_pending)) return;
          const int key=(id(pc_learn_device_idx)+1)*100+id(pc_learn_mode_idx)+1;
          int slot=-1;
          for (int i=0;i<32;i++) if (id(pc_learn_keys)[i]==key) {slot=i;break;}
          if(slot<0) for (int i=0;i<32;i++) if(id(pc_learn_keys)[i]==0) {slot=i;break;}
          if(slot<0) {
            id(pc_learn_status).publish_state("Memoria piena: campione non salvato");
            return;
          }
          const float delta=id(pc_learn_candidate_w);
          if (id(pc_learn_keys)[slot]==0) {
            id(pc_learn_keys)[slot]=key;
            id(pc_learn_means)[slot]=delta;
            id(pc_learn_counts)[slot]=1;
          } else {
            const int n=std::min(1000,id(pc_learn_counts)[slot]+1);
            id(pc_learn_means)[slot]+=(delta-id(pc_learn_means)[slot])/n;
            id(pc_learn_counts)[slot]=n;
          }
          id(pc_learn_last_key)=key;
          id(pc_learn_last_confirm_ms)=millis();
          id(pc_learn_last_confirm_w)=delta;
          char msg[170];
          snprintf(msg,sizeof(msg),"%s | %s | +%.0f W | campioni %d",
            lv_label_get_text(id(pc_learn_device_label)),
            lv_label_get_text(id(pc_learn_mode_label)),delta,id(pc_learn_counts)[slot]);
          id(pc_learn_status).publish_state(msg);
      - script.execute: pc_learn_close

  # Gli avvisi dipendono SOLO da nuove misure di potenza totale.
  # Sul primo dato valido si memorizza la zona senza far vibrare il Knob.
  # Rientro con isteresi di 100 W: evita ripetizioni vicino alle soglie.
  # Nessun polling o ridisegno grafico aggiuntivo.
  - id: pc_haptic_check
    mode: restart
    then:
      - lambda: |-
          id(pc_haptic_event) = 0;
          if (id(pc_boot_active) || id(pc_ota) || id(pc_auto_mode)==2) return;
          const float w = id(pc_home_w).state;
          if (!std::isfinite(w) || w < 0.0f) return;
          const float warn = (float) ${power_warning_w};
          const float crit = (float) ${power_critical_w};
          const float hyst = (float) ${power_haptic_hysteresis_w};
          const int prev = id(pc_haptic_zone);
          int next = prev;
          if (prev < 0) {
            // All'avvio classifica senza suonare/vibrare.
            next = w >= crit ? 2 : (w >= warn ? 1 : 0);
          } else if (prev == 0) {
            next = w >= crit ? 2 : (w >= warn ? 1 : 0);
          } else if (prev == 1) {
            next = w >= crit ? 2 : (w < warn - hyst ? 0 : 1);
          } else {
            // Uscendo dal rosso non avvisa di nuovo per il giallo.
            next = w < crit - hyst ? (w < warn - hyst ? 0 : 1) : 2;
          }
          id(pc_haptic_zone) = next;
          if (prev >= 0 && next > prev)
            id(pc_haptic_event) = next == 2 ? 2 : 1;
      - if:
          condition:
            lambda: 'return id(pc_haptic_event) == 1;'
          then:
            - drv2605.play_effect:
                id: pc_haptic_driver
                effect: 7    # Soft bump: ingresso nel giallo.
      - if:
          condition:
            lambda: 'return id(pc_haptic_event) == 2;'
          then:
            - drv2605.play_effect:
                id: pc_haptic_driver
                effect: 10   # Double click: ingresso nel rosso.

  - id: pc_rotate
    mode: restart
    parameters:
      delta: int
    then:
      - lambda: |-
          if (id(pc_ota) || id(pc_boot_active)) return;
          if (id(pc_auto_mode)==2) { id(pc_auto_cancel_requested)=true; return; }
          uint32_t now = millis();
          if (now - id(pc_last_knob_ms) < 35) return;
          id(pc_last_knob_ms) = now;
          id(pc_last_activity_ms) = now;
          if (id(pc_learn_pending)) {
            const int step=delta>0?1:-1;
            if (id(pc_learn_edit_stage)==0) {
              id(pc_learn_device_idx)=(id(pc_learn_device_idx)+step+11)%11;
              id(pc_learn_mode_idx)=0;
            } else {
              const int n=std::max(1,id(pc_learn_mode_count));
              id(pc_learn_mode_idx)=(id(pc_learn_mode_idx)+step+n)%n;
            }
            return;
          }
          const char *configured[14] = {
            "${appliance_01_sensor}",
            "${appliance_02_sensor}",
            "${appliance_03_sensor}",
            "${appliance_04_sensor}",
            "${appliance_05_sensor}",
            "${appliance_06_sensor}",
            "${appliance_07_sensor}",
            "${appliance_08_sensor}",
            "${appliance_09_sensor}",
            "${appliance_10_sensor}",
            "${appliance_11_sensor}",
            "${appliance_12_sensor}",
            "${appliance_13_sensor}",
            "${appliance_14_sensor}"
          };
          auto present = [&](int i) -> bool {
            return strncmp(configured[i], "sensor.pc_non_configurato_", 26) != 0;
          };
          if (id(pc_page) == 1) {
            // Distacco: prima AUTO per priorita', poi NO AUTO (alfabetico).
            // Scorri senza selezione; con selezione sposta SOLO dentro AUTO.
            auto &order=id(pc_prio_order);
            const int count=(int)order.size();
            if (!count) return;
            const int step=delta>0?1:-1;
            int current=std::max(0,std::min(count-1,id(pc_prio_cursor)));
            int allowed[14]={id(pc_auto_allow_01),id(pc_auto_allow_02),id(pc_auto_allow_03),id(pc_auto_allow_04),
              id(pc_auto_allow_05),id(pc_auto_allow_06),id(pc_auto_allow_07),id(pc_auto_allow_08),
              id(pc_auto_allow_09),id(pc_auto_allow_10),id(pc_auto_allow_11),id(pc_auto_allow_12),
              id(pc_auto_allow_13),id(pc_auto_allow_14)};
            int active_count=0;
            for (int slot:order) if (allowed[slot]) active_count++;
            if (id(pc_prio_edit_slot)<0) {
              id(pc_prio_cursor)=std::max(0,std::min(count-1,current+step));
            } else {
              const int slot=id(pc_prio_edit_slot);
              int from=-1;
              for (int i=0;i<count;i++) if(order[i]==slot) { from=i; break; }
              if (from<0) { id(pc_prio_edit_slot)=-1; return; }
              const bool is_auto=allowed[slot]!=0;
              if (is_auto && step>0 && from==active_count-1) {
                // Uno scatto OLTRE l'ultimo carico AUTO chiede conferma,
                // anche quando sotto ci sono gia' carichi NO AUTO.
                id(pc_prio_prompt_mode)=1;
                id(pc_prio_prompt_slot)=slot;
                id(pc_prio_prompt_since_ms)=now;
                id(pc_page)=6;
              } else if (!is_auto && step<0) {
                // Un escluso torna AUTO SOLO dopo conferma esplicita.
                id(pc_prio_prompt_mode)=2;
                id(pc_prio_prompt_slot)=slot;
                id(pc_prio_prompt_since_ms)=now;
                id(pc_page)=6;
              } else if (is_auto) {
                const int to=std::max(0,std::min(active_count-1,from+step));
                if (to!=from) {
                  std::swap(order[from],order[to]);
                  id(pc_prio_cursor)=to;
                  id(pc_prio_last_move_ms)=now;
                  id(pc_prio_pending)=true;
                  id(pc_prio_saved_ms)=0;
                }
              } else {
                // I NO AUTO rimangono raggruppati in ordine alfabetico.
                id(pc_prio_cursor)=from;
              }
            }
            const int cursor=id(pc_prio_cursor);
            if (cursor<id(pc_prio_top)) id(pc_prio_top)=cursor;
            if (cursor>=id(pc_prio_top)+4) id(pc_prio_top)=cursor-3;
          } else if (id(pc_page)==6) {
            // Modale: la rotazione non vale come consenso.
            return;
          } else if (id(pc_page) == 4) {
            // IMPOSTAZIONI: parametri distacco + soglia apprendimento, salvataggio a 3s.
            const int step=delta>0?1:-1;
            if (id(pc_auto_edit)<0) {
              id(pc_auto_cursor)=std::max(0,std::min(7,id(pc_auto_cursor)+step));
              if (id(pc_auto_cursor)<id(pc_auto_top)) id(pc_auto_top)=id(pc_auto_cursor);
              if (id(pc_auto_cursor)>=id(pc_auto_top)+4) id(pc_auto_top)=id(pc_auto_cursor)-3;
            } else {
              const int n=id(pc_auto_edit);
              if (n==0 || n==1 || n==2) id(pc_auto_draft)=1-id(pc_auto_draft);
              else if (n==7) {
                // Soglia di APPRENDIMENTO: regolazione a step di 5 W.
                id(pc_auto_draft)=std::max(10,std::min(500,id(pc_auto_draft)+step*5));
              } else {
                const int lo=n==3?0:n==4?5:n==5?30:10;
                const int hi=n==3?60:n==4?60:n==5?600:120;
                const int inc=n==5||n==6?10:1;
                id(pc_auto_draft)=std::max(lo,std::min(hi,id(pc_auto_draft)+step*inc));
              }
              id(pc_auto_pending)=true;
              id(pc_auto_last_move_ms)=now;
              id(pc_auto_saved_ms)=0;
            }
          } else if (id(pc_page) == 3) {
            // COLORI: senza selezione scorri le righe, con tap cambi la palette.
            const int count = (int) id(pc_color_order).size();
            if (count == 0) return;
            const int step = delta > 0 ? 1 : -1;
            if (id(pc_color_edit_slot) < 0) {
              id(pc_color_cursor) = std::max(0, std::min(count-1, id(pc_color_cursor)+step));
              if (id(pc_color_cursor) < id(pc_color_top)) id(pc_color_top)=id(pc_color_cursor);
              if (id(pc_color_cursor) >= id(pc_color_top)+4) id(pc_color_top)=id(pc_color_cursor)-3;
            } else {
              id(pc_color_draft) = (id(pc_color_draft) + step + 14) % 14;
              id(pc_color_last_move_ms) = now;
              id(pc_color_pending) = true;
              id(pc_color_saved_ms) = 0;
            }
          } else {
            // Home ed Elettrodomestici: navigazione in ordine di consumo decrescente.
            const float values[14] = {
              id(pc_w_01).state,id(pc_w_02).state,id(pc_w_03).state,id(pc_w_04).state,
              id(pc_w_05).state,id(pc_w_06).state,id(pc_w_07).state,id(pc_w_08).state,
              id(pc_w_09).state,id(pc_w_10).state,id(pc_w_11).state,id(pc_w_12).state,
              id(pc_w_13).state,id(pc_w_14).state
            };
            // Home: mostra soltanto i dispositivi effettivamente accesi.
            // Pagina Elettrodomestici: lascia accessibili tutti quelli configurati.
            const char *controls[14] = {
              "${appliance_01_switch}",
              "${appliance_02_switch}",
              "${appliance_03_switch}",
              "${appliance_04_switch}",
              "${appliance_05_switch}",
              "${appliance_06_switch}",
              "${appliance_07_switch}",
              "${appliance_08_switch}",
              "${appliance_09_switch}",
              "${appliance_10_switch}",
              "${appliance_11_switch}",
              "${appliance_12_switch}",
              "${appliance_13_switch}",
              "${appliance_14_switch}"
            };
            const std::string states[14] = {
              id(pc_control_state_01).state,
              id(pc_control_state_02).state,
              id(pc_control_state_03).state,
              id(pc_control_state_04).state,
              id(pc_control_state_05).state,
              id(pc_control_state_06).state,
              id(pc_control_state_07).state,
              id(pc_control_state_08).state,
              id(pc_control_state_09).state,
              id(pc_control_state_10).state,
              id(pc_control_state_11).state,
              id(pc_control_state_12).state,
              id(pc_control_state_13).state,
              id(pc_control_state_14).state
            };
            auto active = [&](int i) -> bool {
              if (!present(i)) return false;
              if ((controls[i][0] == '\0' || strncmp(controls[i], "switch.pc_non_configurato_", 26) == 0))
                return std::isfinite(values[i]) && values[i] > 0.0f;
              const auto &st = states[i];
              if (strncmp(controls[i], "climate.", 8) == 0)
                return !st.empty() && st != "off" && st != "unknown" && st != "unavailable";
              return st == "on";
            };
            // Il segmento grigio e' l'ULTIMA voce della sola Home.
            // Il suo indice virtuale (14) non va mai in pc_selected: quella variabile
            // e' usata anche nei pulsanti ON/OFF e deve rimanere 0..13.
            const bool in_home = id(pc_page)==0;
            bool other_available = false;
            if (in_home) {
              const float total = id(pc_home_w).state;
              if (std::isfinite(total) && total >= 0.0f) {
                float attributed = 0.0f;
                for (int i=0;i<14;i++)
                  if (active(i) && std::isfinite(values[i]) && values[i]>0.0f)
                    attributed += values[i];
                other_available = total - attributed > 0.0f;
              }
            }
            int order[15]; int count=0;
            for (int i=0;i<14;i++)
              if (in_home ? active(i) : present(i)) order[count++]=i;
            // Ordina SOLO gli apparecchi: 'Altri consumi' rimane in fondo.
            for (int i=0;i<count-1;i++) for (int j=i+1;j<count;j++) {
              float wi = std::isfinite(values[order[i]]) && values[order[i]]>0 ? values[order[i]] : 0.0f;
              float wj = std::isfinite(values[order[j]]) && values[order[j]]>0 ? values[order[j]] : 0.0f;
              if (wj > wi) { int t=order[i]; order[i]=order[j]; order[j]=t; }
            }
            if (in_home && other_available) order[count++]=14;
            if (count>0) {
              const int current = (in_home && id(pc_home_other_selected)) ? 14 : id(pc_selected);
              int pos=-1;
              for (int i=0;i<count;i++) if (order[i]==current) { pos=i; break; }
              // Se la selezione e' sparita, riparti dal primo apparecchio attivo
              // (oppure dal grigio se e' l'unica voce disponibile).
              const int target = pos<0 ? order[0] : order[(pos + (delta>0?1:-1) + count)%count];
              if (in_home) id(pc_home_other_selected) = target==14;
              if (target<14) id(pc_selected)=target;
              if (in_home) id(pc_home_selection_explicit)=true;
            } else if (in_home) {
              id(pc_home_other_selected)=false;
              id(pc_home_selection_explicit)=false;
            }
          }
          id(pc_dirty) = true;
      - if:
          condition:
            lambda: 'return id(pc_learn_pending) && id(pc_auto_mode)!=2;'
          then:
            - script.execute: pc_learn_draw
      - if:
          condition:
            lambda: 'return id(pc_prio_prompt_mode)!=0 && id(pc_page)==6;'
          then:
            - script.execute: pc_prio_prompt_show
      - if:
          condition:
            lambda: 'return id(pc_auto_cancel_requested);'
          then:
            - script.execute: pc_auto_cancel
          else:
            - script.execute: pc_refresh

  # Prepara la lista SOLO entrando nel Setup: 1=primo da poter spegnere.
  # Gli ex aequo sono ordinati per nome; il draft e' indipendente dai valori salvati.
  - id: pc_prio_enter
    mode: restart
    then:
      - lambda: |-
          const char *names[14] = {
            "${appliance_01_name}","${appliance_02_name}","${appliance_03_name}","${appliance_04_name}",
            "${appliance_05_name}","${appliance_06_name}","${appliance_07_name}","${appliance_08_name}",
            "${appliance_09_name}","${appliance_10_name}","${appliance_11_name}","${appliance_12_name}",
            "${appliance_13_name}","${appliance_14_name}"
          };
          const char *sensors[14] = {
            "${appliance_01_sensor}","${appliance_02_sensor}","${appliance_03_sensor}","${appliance_04_sensor}",
            "${appliance_05_sensor}","${appliance_06_sensor}","${appliance_07_sensor}","${appliance_08_sensor}",
            "${appliance_09_sensor}","${appliance_10_sensor}","${appliance_11_sensor}","${appliance_12_sensor}",
            "${appliance_13_sensor}","${appliance_14_sensor}"
          };
          const char *controls[14] = {
            "${appliance_01_switch}","${appliance_02_switch}","${appliance_03_switch}","${appliance_04_switch}",
            "${appliance_05_switch}","${appliance_06_switch}","${appliance_07_switch}","${appliance_08_switch}",
            "${appliance_09_switch}","${appliance_10_switch}","${appliance_11_switch}","${appliance_12_switch}",
            "${appliance_13_switch}","${appliance_14_switch}"
          };
          const int priorities[14] = {
            id(pc_priority_01),id(pc_priority_02),id(pc_priority_03),id(pc_priority_04),
            id(pc_priority_05),id(pc_priority_06),id(pc_priority_07),id(pc_priority_08),
            id(pc_priority_09),id(pc_priority_10),id(pc_priority_11),id(pc_priority_12),
            id(pc_priority_13),id(pc_priority_14)
          };
          auto &order = id(pc_prio_order);
          order.clear();
          for (int i=0;i<14;i++) {
            const bool configured = strncmp(sensors[i],"sensor.pc_non_configurato_",26)!=0;
            const bool controllable = strncmp(controls[i],"switch.",7)==0 ||
                                      strncmp(controls[i],"climate.",8)==0;
            const bool placeholder = strncmp(controls[i],"switch.pc_non_configurato_",26)==0;
            if (configured && controllable && !placeholder) order.push_back(i);
          }
          // I carichi AUTO precedono tutti i NO AUTO. Solo gli AUTO
          // hanno una priorita' operativa; esclusi in ordine alfabetico.
          const int allowed[14]={id(pc_auto_allow_01),id(pc_auto_allow_02),id(pc_auto_allow_03),id(pc_auto_allow_04),
            id(pc_auto_allow_05),id(pc_auto_allow_06),id(pc_auto_allow_07),id(pc_auto_allow_08),
            id(pc_auto_allow_09),id(pc_auto_allow_10),id(pc_auto_allow_11),id(pc_auto_allow_12),
            id(pc_auto_allow_13),id(pc_auto_allow_14)};
          for (int i=0;i<(int)order.size()-1;i++)
            for (int j=i+1;j<(int)order.size();j++) {
              const int a=order[i], b=order[j];
              if (allowed[b]>allowed[a] ||
                  (allowed[a]==allowed[b] && (
                   (allowed[a] && priorities[b]<priorities[a]) ||
                   ((!allowed[a] || priorities[a]==priorities[b]) && strcmp(names[b],names[a])<0))))
                std::swap(order[i],order[j]);
            }
          id(pc_prio_cursor)=0;
          id(pc_prio_top)=0;
          id(pc_prio_edit_slot)=-1;
          id(pc_prio_pending)=false;
          id(pc_prio_saved_ms)=0;
          id(pc_prio_prompt_mode)=0;
          id(pc_prio_prompt_slot)=-1;
          id(pc_page)=1;
          id(pc_dirty)=true;
      - script.execute: pc_refresh

  # Tap su una delle quattro righe visibili: la rotazione passa in modalita' SPOSTA.
  - id: pc_prio_select_row
    mode: restart
    parameters:
      row: int
    then:
      - if:
          condition:
            lambda: 'return id(pc_prio_pending);'
          then:
            - script.execute: pc_prio_commit
      - lambda: |-
          if (id(pc_ota) || id(pc_boot_active) || id(pc_page)!=1) return;
          const int position=id(pc_prio_top)+row;
          if (position<0 || position>=(int)id(pc_prio_order).size()) return;
          id(pc_prio_cursor)=position;
          id(pc_prio_edit_slot)=id(pc_prio_order)[position];
          id(pc_prio_last_move_ms)=millis();
          id(pc_prio_saved_ms)=0;
      - script.execute: pc_refresh

  # I valori persistenti vengono aggiornati SOLO alla fine del movimento.
  - id: pc_prio_commit
    mode: restart
    then:
      - lambda: |-
          if (id(pc_prio_pending)) {
            int *priorities[14] = {
              &id(pc_priority_01),&id(pc_priority_02),&id(pc_priority_03),&id(pc_priority_04),
              &id(pc_priority_05),&id(pc_priority_06),&id(pc_priority_07),&id(pc_priority_08),
              &id(pc_priority_09),&id(pc_priority_10),&id(pc_priority_11),&id(pc_priority_12),
              &id(pc_priority_13),&id(pc_priority_14)
            };
            // AUTO: priorita' consecutive. NO AUTO: valore sentinella,
            // mai interpretato come permesso di distacco.
            const int allowed[14]={id(pc_auto_allow_01),id(pc_auto_allow_02),id(pc_auto_allow_03),id(pc_auto_allow_04),
              id(pc_auto_allow_05),id(pc_auto_allow_06),id(pc_auto_allow_07),id(pc_auto_allow_08),
              id(pc_auto_allow_09),id(pc_auto_allow_10),id(pc_auto_allow_11),id(pc_auto_allow_12),
              id(pc_auto_allow_13),id(pc_auto_allow_14)};
            const auto &order=id(pc_prio_order);
            int rank=0;
            for (int slot:order) *priorities[slot]=allowed[slot]?(++rank):99;
            id(pc_prio_saved_ms)=millis();
          }
          id(pc_prio_pending)=false;
          id(pc_prio_edit_slot)=-1;
          id(pc_dirty)=true;
      - script.execute: pc_refresh

  # Modale NO AUTO / AUTO: nessuna azione e' eseguita senza tap su SI.
  - id: pc_prio_prompt_show
    mode: restart
    then:
      - lambda: |-
          if (id(pc_page)!=6 || id(pc_prio_prompt_mode)==0) return;
          const char *names[14]={
            "${appliance_01_name}","${appliance_02_name}","${appliance_03_name}","${appliance_04_name}",
            "${appliance_05_name}","${appliance_06_name}","${appliance_07_name}","${appliance_08_name}",
            "${appliance_09_name}","${appliance_10_name}","${appliance_11_name}","${appliance_12_name}",
            "${appliance_13_name}","${appliance_14_name}"};
          const int slot=id(pc_prio_prompt_slot);
          if (slot<0 || slot>=14) return;
          lv_label_set_text(id(pc_prio_prompt_title),
            id(pc_prio_prompt_mode)==1 ? "ESCLUDERE?" : "RIABILITARE?");
          lv_label_set_text(id(pc_prio_prompt_name),names[slot]);
          lv_label_set_text(id(pc_prio_prompt_explain),
            id(pc_prio_prompt_mode)==1 ? "NON SPEGNERE IN AUTO" : "CONSENTIRE DISTACCO AUTO");
      - lvgl.page.show:
          id: pc_prio_prompt_page
          animation: NONE

  - id: pc_prio_prompt_answer
    mode: restart
    parameters:
      accept: bool
    then:
      - lambda: |-
          if (id(pc_page)!=6 || id(pc_prio_prompt_mode)==0) return;
          const int slot=id(pc_prio_prompt_slot);
          const int mode=id(pc_prio_prompt_mode);
          if (slot<0 || slot>=14) { id(pc_prio_prompt_mode)=0; return; }
          if (accept) {
            int *allow[14]={&id(pc_auto_allow_01),&id(pc_auto_allow_02),&id(pc_auto_allow_03),&id(pc_auto_allow_04),
              &id(pc_auto_allow_05),&id(pc_auto_allow_06),&id(pc_auto_allow_07),&id(pc_auto_allow_08),
              &id(pc_auto_allow_09),&id(pc_auto_allow_10),&id(pc_auto_allow_11),&id(pc_auto_allow_12),
              &id(pc_auto_allow_13),&id(pc_auto_allow_14)};
            auto &order=id(pc_prio_order);
            int from=-1;
            for (int i=0;i<(int)order.size();i++) if(order[i]==slot) {from=i; break;}
            if (from>=0) {
              // Conclusa una scelta esplicita, ricostruisci i due gruppi:
              // AUTO in cima, esclusi dopo, ordinati per nome.
              *allow[slot]=(mode==2)?1:0;
              order.erase(order.begin()+from);
              if (mode==1) order.push_back(slot);
              else {
                int last_auto=0;
                for (int item:order) if(*allow[item]) last_auto++;
                order.insert(order.begin()+last_auto,slot);
              }
              if (mode==1) {
                const char *names[14]={
                  "${appliance_01_name}","${appliance_02_name}","${appliance_03_name}","${appliance_04_name}",
                  "${appliance_05_name}","${appliance_06_name}","${appliance_07_name}","${appliance_08_name}",
                  "${appliance_09_name}","${appliance_10_name}","${appliance_11_name}","${appliance_12_name}",
                  "${appliance_13_name}","${appliance_14_name}"};
                int first_no_auto=0;
                for (int item:order) if(*allow[item]) first_no_auto++;
                for (int i=first_no_auto;i<(int)order.size()-1;i++)
                  for (int j=i+1;j<(int)order.size();j++)
                    if (strcmp(names[order[j]],names[order[i]])<0) std::swap(order[i],order[j]);
              }
              for (int i=0;i<(int)order.size();i++) if (order[i]==slot) {id(pc_prio_cursor)=i;break;}
              id(pc_prio_pending)=true;
              id(pc_prio_saved_ms)=0;
              // La scelta esplicita SI e' l'unico punto che modifica AUTO.
              // L'azione successiva pc_prio_commit salva subito le priorita'.
            }
          }
          id(pc_prio_last_move_ms)=millis();
          id(pc_last_activity_ms)=millis();
          id(pc_prio_prompt_mode)=0;
          id(pc_prio_prompt_slot)=-1;
          id(pc_page)=1;
          const int cursor=id(pc_prio_cursor);
          if (cursor<id(pc_prio_top)) id(pc_prio_top)=cursor;
          if (cursor>=id(pc_prio_top)+4) id(pc_prio_top)=cursor-3;
          id(pc_dirty)=true;
      - lvgl.page.show:
          id: setup_page
          animation: NONE
      - if:
          condition:
            lambda: 'return accept && id(pc_prio_pending);'
          then:
            - script.execute: pc_prio_commit
          else:
            - script.execute: pc_refresh

  # COLORI: lista alfabetica, inclusi gli slot solo-monitoraggio configurati.
  - id: pc_color_enter
    mode: restart
    then:
      - lambda: |-
          const char *names[14] = {
            "${appliance_01_name}","${appliance_02_name}","${appliance_03_name}","${appliance_04_name}",
            "${appliance_05_name}","${appliance_06_name}","${appliance_07_name}","${appliance_08_name}",
            "${appliance_09_name}","${appliance_10_name}","${appliance_11_name}","${appliance_12_name}",
            "${appliance_13_name}","${appliance_14_name}"
          };
          const char *sensors[14] = {
            "${appliance_01_sensor}","${appliance_02_sensor}","${appliance_03_sensor}","${appliance_04_sensor}",
            "${appliance_05_sensor}","${appliance_06_sensor}","${appliance_07_sensor}","${appliance_08_sensor}",
            "${appliance_09_sensor}","${appliance_10_sensor}","${appliance_11_sensor}","${appliance_12_sensor}",
            "${appliance_13_sensor}","${appliance_14_sensor}"
          };
          auto &order=id(pc_color_order);
          order.clear();
          for (int i=0;i<14;i++)
            if (strncmp(sensors[i],"sensor.pc_non_configurato_",26)!=0) order.push_back(i);
          for (int i=0;i<(int)order.size()-1;i++)
            for (int j=i+1;j<(int)order.size();j++)
              if (strcmp(names[order[j]],names[order[i]])<0) std::swap(order[i],order[j]);
          id(pc_color_cursor)=0;
          id(pc_color_top)=0;
          id(pc_color_edit_slot)=-1;
          id(pc_color_pending)=false;
          id(pc_color_saved_ms)=0;
          id(pc_page)=3;
          id(pc_dirty)=true;
      - script.execute: pc_refresh

  # Tap su una riga: bozza del colore, non ancora scritta in flash.
  - id: pc_color_select_row
    mode: restart
    parameters:
      row: int
    then:
      - if:
          condition:
            lambda: 'return id(pc_color_pending);'
          then:
            - script.execute: pc_color_commit
      - lambda: |-
          if (id(pc_ota) || id(pc_boot_active) || id(pc_page)!=3) return;
          const int pos=id(pc_color_top)+row;
          if (pos<0 || pos>=(int)id(pc_color_order).size()) return;
          int *colors[14] = {
            &id(pc_color_01),&id(pc_color_02),&id(pc_color_03),&id(pc_color_04),
            &id(pc_color_05),&id(pc_color_06),&id(pc_color_07),&id(pc_color_08),
            &id(pc_color_09),&id(pc_color_10),&id(pc_color_11),&id(pc_color_12),
            &id(pc_color_13),&id(pc_color_14)
          };
          id(pc_color_cursor)=pos;
          id(pc_color_edit_slot)=id(pc_color_order)[pos];
          id(pc_color_draft)=(*colors[id(pc_color_edit_slot)]%14+14)%14;
          id(pc_color_last_move_ms)=millis();
          id(pc_color_pending)=false;
          id(pc_color_saved_ms)=0;
      - script.execute: pc_refresh

  # Dopo 3s senza rotazione applica una sola volta il colore persistente.
  - id: pc_color_commit
    mode: restart
    then:
      - lambda: |-
          if (id(pc_color_pending) && id(pc_color_edit_slot)>=0 && id(pc_color_edit_slot)<14) {
            int *colors[14] = {
              &id(pc_color_01),&id(pc_color_02),&id(pc_color_03),&id(pc_color_04),
              &id(pc_color_05),&id(pc_color_06),&id(pc_color_07),&id(pc_color_08),
              &id(pc_color_09),&id(pc_color_10),&id(pc_color_11),&id(pc_color_12),
              &id(pc_color_13),&id(pc_color_14)
            };
            *colors[id(pc_color_edit_slot)] = id(pc_color_draft);
            id(pc_color_saved_ms)=millis();
          }
          id(pc_color_pending)=false;
          id(pc_color_edit_slot)=-1;
          id(pc_dirty)=true;
      - script.execute: pc_refresh

  - id: pc_choose_slot
    mode: restart
    parameters:
      delta: int
    then:
      - lambda: |-
          if (id(pc_ota) || id(pc_boot_active)) return;
          const char *configured[14] = {
            "${appliance_01_sensor}",
            "${appliance_02_sensor}",
            "${appliance_03_sensor}",
            "${appliance_04_sensor}",
