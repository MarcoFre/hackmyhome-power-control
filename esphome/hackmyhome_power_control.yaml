          id(pc_auto_candidate)=-1;
          id(pc_auto_overlay_open)=false;
          id(pc_auto_fire)=false;
          id(pc_auto_haptic_event)=0;
          id(pc_auto_suspended_until_ms)=millis()+((uint32_t)id(pc_auto_suspend_s))*1000u;
          id(pc_page)=0;
          id(pc_last_activity_ms)=millis();
          id(pc_home_selection_explicit)=false;
          id(pc_dirty)=true;
      - lvgl.page.show:
          id: power_page
          animation: NONE
      - script.execute: pc_refresh

  # Il servizio HA viene richiesto UNA sola volta; non assumiamo che sia riuscito.
  - id: pc_auto_send_off
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              if (!id(pc_auto_fire) || id(pc_auto_mode)!=2 || id(pc_ota) || id(pc_boot_active) ||
                  !id(pc_auto_enabled) || !id(pc_wifi).is_connected() ||
                  !id(pc_api).is_connected_with_state_subscription()) return false;
              const int s=id(pc_auto_candidate);
              if (s<0 || s>=14 || (id(pc_auto_attempted_mask)&(1u<<s))) return false;
              const float w=id(pc_home_w).state;
              if (!std::isfinite(w) || w<0 || id(pc_auto_last_power_data_ms)==0 ||
                  (uint32_t)(millis()-id(pc_auto_last_power_data_ms))>180000u) return false;
              const int z=(w>=${power_critical_w} && id(pc_auto_red))?2:
                ((w>=${power_warning_w} && id(pc_auto_yellow))?1:0);
              if (z<id(pc_auto_zone)) return false;
              const char *controls[14]={
                "${appliance_01_switch}","${appliance_02_switch}","${appliance_03_switch}","${appliance_04_switch}",
                "${appliance_05_switch}","${appliance_06_switch}","${appliance_07_switch}","${appliance_08_switch}",
                "${appliance_09_switch}","${appliance_10_switch}","${appliance_11_switch}","${appliance_12_switch}",
                "${appliance_13_switch}","${appliance_14_switch}"};
              const std::string states[14]={
                id(pc_control_state_01).state,id(pc_control_state_02).state,id(pc_control_state_03).state,id(pc_control_state_04).state,
                id(pc_control_state_05).state,id(pc_control_state_06).state,id(pc_control_state_07).state,id(pc_control_state_08).state,
                id(pc_control_state_09).state,id(pc_control_state_10).state,id(pc_control_state_11).state,id(pc_control_state_12).state,
                id(pc_control_state_13).state,id(pc_control_state_14).state};
              const float powers[14]={
                id(pc_w_01).state,id(pc_w_02).state,id(pc_w_03).state,id(pc_w_04).state,
                id(pc_w_05).state,id(pc_w_06).state,id(pc_w_07).state,id(pc_w_08).state,
                id(pc_w_09).state,id(pc_w_10).state,id(pc_w_11).state,id(pc_w_12).state,
                id(pc_w_13).state,id(pc_w_14).state};
              const int allowed[14]={id(pc_auto_allow_01),id(pc_auto_allow_02),id(pc_auto_allow_03),id(pc_auto_allow_04),id(pc_auto_allow_05),id(pc_auto_allow_06),id(pc_auto_allow_07),id(pc_auto_allow_08),id(pc_auto_allow_09),id(pc_auto_allow_10),id(pc_auto_allow_11),id(pc_auto_allow_12),id(pc_auto_allow_13),id(pc_auto_allow_14)};
              if (!allowed[s] || !std::isfinite(powers[s]) || powers[s]<10.0f) return false;
              if (strncmp(controls[s],"switch.",7)==0) return states[s]=="on";
              if (strncmp(controls[s],"climate.",8)==0)
                return !states[s].empty() && states[s]!="off" && states[s]!="unknown" && states[s]!="unavailable";
              return false;
          then:
            - homeassistant.action:
                action: !lambda |-
                  const char *controls[14]={
                    "${appliance_01_switch}","${appliance_02_switch}","${appliance_03_switch}","${appliance_04_switch}",
                    "${appliance_05_switch}","${appliance_06_switch}","${appliance_07_switch}","${appliance_08_switch}",
                    "${appliance_09_switch}","${appliance_10_switch}","${appliance_11_switch}","${appliance_12_switch}",
                    "${appliance_13_switch}","${appliance_14_switch}"};
                  return std::string(strncmp(controls[id(pc_auto_candidate)],"climate.",8)==0 ? "climate.turn_off" : "switch.turn_off");
                data_template:
                  entity_id: "{{ target_entity }}"
                variables:
                  target_entity: !lambda |-
                    const char *controls[14]={
                      "${appliance_01_switch}","${appliance_02_switch}","${appliance_03_switch}","${appliance_04_switch}",
                      "${appliance_05_switch}","${appliance_06_switch}","${appliance_07_switch}","${appliance_08_switch}",
                      "${appliance_09_switch}","${appliance_10_switch}","${appliance_11_switch}","${appliance_12_switch}",
                      "${appliance_13_switch}","${appliance_14_switch}"};
                    return std::string(controls[id(pc_auto_candidate)]);
            - lambda: |-
                id(pc_auto_attempted_mask)|=(1u<<id(pc_auto_candidate));
                id(pc_auto_last_command_slot)=id(pc_auto_candidate);
                id(pc_auto_mode)=3;  // attesa nuova misura/stato, non successo presunto
                id(pc_auto_post_until_ms)=millis()+((uint32_t)id(pc_auto_after_s))*1000u;
                id(pc_auto_last_data_at_command_ms)=id(pc_auto_last_power_data_ms);
                id(pc_auto_overlay_open)=false;
                id(pc_auto_fire)=false;
                id(pc_auto_candidate)=-1;
                id(pc_page)=0;
                id(pc_last_activity_ms)=millis();
                id(pc_dirty)=true;
            - drv2605.stop:
                id: pc_haptic_driver
            - lvgl.page.show:
                id: power_page
                animation: NONE
            - script.execute: pc_refresh
          else:
            - lambda: |-
                id(pc_auto_fire)=false;
                id(pc_auto_mode)=0;
                id(pc_auto_overlay_open)=false;
                id(pc_auto_candidate)=-1;
                id(pc_page)=0;
                id(pc_dirty)=true;
            - drv2605.stop:
                id: pc_haptic_driver
            - lvgl.page.show:
                id: power_page
                animation: NONE
            - script.execute: pc_refresh

  # Stato automatico: attesa stabile -> conferma -> richiesta OFF -> verifica.
  - id: pc_auto_tick
    mode: single
    then:
      - lambda: |-
          const uint32_t now=millis();
          id(pc_auto_haptic_event)=0;
          id(pc_auto_fire)=false;
          if (id(pc_boot_active) || id(pc_ota) || !id(pc_auto_enabled)) {
            if (id(pc_auto_overlay_open)) id(pc_auto_abort_overlay)=true;
            id(pc_auto_mode)=0;
            return;
          }
          // Non avviare distacchi senza Home Assistant o con sensore non aggiornato.
          const bool connected=id(pc_wifi).is_connected() && id(pc_api).is_connected_with_state_subscription();
          const float total=id(pc_home_w).state;
          const bool fresh=connected && std::isfinite(total) && total>=0.0f &&
            id(pc_auto_last_power_data_ms)!=0 &&
            (uint32_t)(now-id(pc_auto_last_power_data_ms))<=180000u;
          if (!fresh) {
            if (id(pc_auto_overlay_open)) id(pc_auto_abort_overlay)=true;
            // Se era gia' stato chiesto un OFF, non procedere con altri carichi
            // dopo una disconnessione senza avere il riscontro di stato.
            if (id(pc_auto_mode)!=3) id(pc_auto_mode)=0;
            id(pc_auto_candidate)=-1;
            return;
          }
          int zone=(total>=${power_critical_w} && id(pc_auto_red))?2:
                   ((total>=${power_warning_w} && id(pc_auto_yellow))?1:0);
          // Isteresi per annullare: evita continue aperture vicino alla soglia.
          if (id(pc_auto_mode)==2) {
            const float limit=id(pc_auto_zone)==2?${power_critical_w}:${power_warning_w};
            if (total<limit-100.0f || zone<id(pc_auto_zone)) {
              id(pc_auto_mode)=0;
              id(pc_auto_candidate)=-1;
              id(pc_auto_abort_overlay)=true;
              return;
            }
          }
          if (!zone) {
            id(pc_auto_mode)=0;
            id(pc_auto_candidate)=-1;
            id(pc_auto_attempted_mask)=0;
            id(pc_auto_zone)=0;
            id(pc_auto_zone_since_ms)=now;
            if (id(pc_auto_overlay_open)) id(pc_auto_abort_overlay)=true;
            return;
          }
          if (id(pc_auto_mode)==3) {
            if ((int32_t)(now-id(pc_auto_post_until_ms))<0) return;
            // Senza un nuovo dato totale E il riscontro OFF non distaccare altro.
            if (id(pc_auto_last_power_data_ms)==id(pc_auto_last_data_at_command_ms)) return;
            const std::string states[14]={
              id(pc_control_state_01).state,id(pc_control_state_02).state,id(pc_control_state_03).state,id(pc_control_state_04).state,
              id(pc_control_state_05).state,id(pc_control_state_06).state,id(pc_control_state_07).state,id(pc_control_state_08).state,
              id(pc_control_state_09).state,id(pc_control_state_10).state,id(pc_control_state_11).state,id(pc_control_state_12).state,
              id(pc_control_state_13).state,id(pc_control_state_14).state};
            if (id(pc_auto_last_command_slot)<0 || id(pc_auto_last_command_slot)>=14 ||
                states[id(pc_auto_last_command_slot)]!="off") return;
            id(pc_auto_mode)=0;
          }
          if (id(pc_auto_mode)==2) {
            const int rem=(int)((((int32_t)(id(pc_auto_deadline_ms)-now))+999)/1000);
            if (rem>0 && rem!=id(pc_auto_last_haptic_sec)) {
              id(pc_auto_last_haptic_sec)=rem;
              id(pc_auto_haptic_event)=rem<=5?2:1;
            }
            if (rem<=0) id(pc_auto_fire)=true;
            return;
          }
          // Mai aprire una nuova conferma automatica mentre si cambia
          // una regola, una priorita' o un permesso (modale NO AUTO).
          if (id(pc_page)==1 || id(pc_page)==4 || id(pc_page)==6) {
            if (id(pc_auto_mode)!=3) id(pc_auto_mode)=0;
            return;
          }
          // La sospensione si applica dopo ANNULLA o rotazione dell'encoder.
          if ((int32_t)(now-id(pc_auto_suspended_until_ms))<0) return;
          if (id(pc_page)==4 && id(pc_auto_edit)>=0) return;
          if (zone!=id(pc_auto_zone) || id(pc_auto_mode)!=1) {
            id(pc_auto_zone)=zone;
            id(pc_auto_zone_since_ms)=now;
            id(pc_auto_mode)=1;
            return;
          }
          if ((uint32_t)(now-id(pc_auto_zone_since_ms))<(uint32_t)id(pc_auto_delay_s)*1000u) return;
          const char *names[14]={
            "${appliance_01_name}","${appliance_02_name}","${appliance_03_name}","${appliance_04_name}",
            "${appliance_05_name}","${appliance_06_name}","${appliance_07_name}","${appliance_08_name}",
            "${appliance_09_name}","${appliance_10_name}","${appliance_11_name}","${appliance_12_name}",
            "${appliance_13_name}","${appliance_14_name}"};
          const char *sensors[14]={
            "${appliance_01_sensor}","${appliance_02_sensor}","${appliance_03_sensor}","${appliance_04_sensor}",
            "${appliance_05_sensor}","${appliance_06_sensor}","${appliance_07_sensor}","${appliance_08_sensor}",
            "${appliance_09_sensor}","${appliance_10_sensor}","${appliance_11_sensor}","${appliance_12_sensor}",
            "${appliance_13_sensor}","${appliance_14_sensor}"};
          const char *controls[14]={
            "${appliance_01_switch}","${appliance_02_switch}","${appliance_03_switch}","${appliance_04_switch}",
            "${appliance_05_switch}","${appliance_06_switch}","${appliance_07_switch}","${appliance_08_switch}",
            "${appliance_09_switch}","${appliance_10_switch}","${appliance_11_switch}","${appliance_12_switch}",
            "${appliance_13_switch}","${appliance_14_switch}"};
          const std::string states[14]={
            id(pc_control_state_01).state,id(pc_control_state_02).state,id(pc_control_state_03).state,id(pc_control_state_04).state,
            id(pc_control_state_05).state,id(pc_control_state_06).state,id(pc_control_state_07).state,id(pc_control_state_08).state,
            id(pc_control_state_09).state,id(pc_control_state_10).state,id(pc_control_state_11).state,id(pc_control_state_12).state,
            id(pc_control_state_13).state,id(pc_control_state_14).state};
          const float powers[14]={
            id(pc_w_01).state,id(pc_w_02).state,id(pc_w_03).state,id(pc_w_04).state,
            id(pc_w_05).state,id(pc_w_06).state,id(pc_w_07).state,id(pc_w_08).state,
