            // Gli archi hanno ampiezza FISSA; la parte colorata cresce dentro
            // il solo settore pertinente, senza ricolorare l'intero gauge.
            const float gw=std::max(0.0f,home);
            const float limit=(float)${power_limit_w};
            const float warn=(float)${power_warning_w};
            const float crit=(float)${power_critical_w};
            // Gli angoli sono calcolati dalle soglie configurabili, una sola volta.
            // Con le impostazioni attuali: verde 135..356, giallo 356..37, rosso 37..45.
            static bool sectors_initialized=false;
            if (!sectors_initialized && limit>0 && warn>0 && crit>warn && limit>crit) {
              const int boundary_green=(135+(int)lroundf(270.0f*warn/limit))%360;
              const int boundary_yellow=(135+(int)lroundf(270.0f*crit/limit))%360;
              lv_arc_set_bg_angles(id(pc_outer_green),135,boundary_green);
              lv_arc_set_bg_angles(id(pc_outer_yellow),boundary_green,boundary_yellow);
              lv_arc_set_bg_angles(id(pc_outer_red),boundary_yellow,45);
              sectors_initialized=true;
            }
            auto sector_pct = [&](float low,float high) -> int {
              if (!(high>low)) return 0;
              return (int)std::lround(100.0f*std::max(0.0f,std::min(high-low,gw-low))/(high-low));
            };
            const int green=sector_pct(0.0f,warn);
            const int yellow=sector_pct(warn,crit);
            const int red=sector_pct(crit,limit);
            lv_arc_set_value(id(pc_outer_green),green);
            lv_arc_set_value(id(pc_outer_yellow),yellow);
            lv_arc_set_value(id(pc_outer_red),red);
            if (green>0) lv_obj_remove_flag(id(pc_outer_green),LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(pc_outer_green),LV_OBJ_FLAG_HIDDEN);
            if (yellow>0) lv_obj_remove_flag(id(pc_outer_yellow),LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(pc_outer_yellow),LV_OBJ_FLAG_HIDDEN);
            if (red>0) lv_obj_remove_flag(id(pc_outer_red),LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(pc_outer_red),LV_OBJ_FLAG_HIDDEN);
            lv_obj_t *arcs[15] = {id(pc_seg_01), id(pc_seg_02), id(pc_seg_03), id(pc_seg_04), id(pc_seg_05), id(pc_seg_06), id(pc_seg_07), id(pc_seg_08), id(pc_seg_09), id(pc_seg_10), id(pc_seg_11), id(pc_seg_12), id(pc_seg_13), id(pc_seg_14), id(pc_seg_other)};

            // Home: solo carichi attivi, dal consumo istantaneo maggiore al minore.
            int order[14]; int count=0;
            for (int i=0;i<14;i++) if (home_active[i]) order[count++]=i;
            for (int i=0;i<count-1;i++) for (int j=i+1;j<count;j++) {
              if (measured[order[j]] > measured[order[i]]) {
                int t=order[i]; order[i]=order[j]; order[j]=t;
              }
            }
            // Senza scelta manuale parti dall'apparecchio piu' energivoro.
            // Se non ce ne sono e il totale e' valido, seleziona il grigio.
            // Mantieni la selezione manuale (anche il grigio) finche' e' visibile.
            const bool gray_available = total_ok && other>0.0f;
            const bool selection_visible = id(pc_home_other_selected)
              ? gray_available : (s>=0 && s<14 && home_active[s]);
            if (!id(pc_home_selection_explicit) || !selection_visible) {
              if (count>0) {
                id(pc_selected)=order[0];
                id(pc_home_other_selected)=false;
              } else {
                id(pc_home_other_selected)=gray_available;
              }
              id(pc_home_selection_explicit)=false;
            }
            s=id(pc_selected);

            // Tutti i segmenti interni usano ESATTAMENTE lo stesso arco del gauge esterno:
            // 135 -> 45 = 270 gradi, con apertura inferiore.
            const int ARC_START = 135;
            const int ARC_SWEEP = 270;
            for (int i=0;i<15;i++) lv_obj_add_flag(arcs[i],LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(pc_selected_arc), LV_OBJ_FLAG_HIDDEN);

            int used_angle=0;
            int selected_start=-1, selected_end=-1;
            for (int rank=0; rank<count; rank++) {
              int idx=order[rank];
              float portion=measured[idx];
              if (denominator<=0 || portion<=0) continue;
              int span=(int)std::lround((float)ARC_SWEEP*portion/denominator);
              // Conserva almeno un grado per la quota grigia, se presente:
              // deve restare visibile e selezionabile anche con molti carichi.
              const int available=ARC_SWEEP-used_angle-(gray_available ? 1 : 0);
              if (available<=0) break;
              span=std::max(1,std::min(available,span));
              int a0=(ARC_START+used_angle)%360;
              int a1=(ARC_START+used_angle+span)%360;
              lv_arc_set_bg_angles(arcs[idx],a0,a1);
              lv_obj_set_style_arc_color(arcs[idx],lv_color_hex(palette[*colors[idx]%14]),LV_PART_MAIN);
              lv_obj_remove_flag(arcs[idx],LV_OBJ_FLAG_HIDDEN);
              if (idx==s) { selected_start=a0; selected_end=a1; }
              used_angle+=span;
