  - id: pc_auto_settings_select_row
    mode: restart
    parameters:
      row: int
    then:
      - if:
          condition:
            lambda: 'return id(pc_auto_pending);'
          then:
            - script.execute: pc_auto_settings_commit
      - lambda: |-
          if (id(pc_ota) || id(pc_boot_active) || id(pc_page)!=4) return;
          const int index=id(pc_auto_top)+row;
          if (index<0 || index>=8) return;
          const int values[8]={id(pc_auto_enabled),id(pc_auto_yellow),id(pc_auto_red),
            id(pc_auto_delay_s),id(pc_auto_confirm_s),id(pc_auto_suspend_s),id(pc_auto_after_s),
            id(pc_learn_min_rise_w)};
          id(pc_auto_cursor)=index;
          id(pc_auto_edit)=index;
          id(pc_auto_draft)=values[index];
          id(pc_auto_last_move_ms)=millis();
          id(pc_auto_saved_ms)=0;
          id(pc_last_activity_ms)=millis();
      - script.execute: pc_refresh

  - id: pc_auto_settings_commit
    mode: restart
    then:
      - lambda: |-
          if (id(pc_auto_pending) && id(pc_auto_edit)>=0 && id(pc_auto_edit)<8) {
            if (id(pc_auto_edit)==7) {
              // Memorizza una sola volta a fine regolazione, senza ricompilazione.
              id(pc_learn_min_rise_w)=id(pc_auto_draft);
              // Non interpretare come nuovo avvio un carico gia presente
              // quando viene cambiata la soglia.
              id(pc_learn_streak)=0;
              id(pc_learn_base_ready)=false;
              id(pc_learn_last_sample_ms)=id(pc_auto_last_power_data_ms);
            } else {
              int *vars[7]={&id(pc_auto_enabled),&id(pc_auto_yellow),&id(pc_auto_red),
                &id(pc_auto_delay_s),&id(pc_auto_confirm_s),&id(pc_auto_suspend_s),&id(pc_auto_after_s)};
              *vars[id(pc_auto_edit)]=id(pc_auto_draft);
              if (!id(pc_auto_enabled)) id(pc_auto_mode)=0;
            }
            id(pc_auto_saved_ms)=millis();
          }
          id(pc_auto_pending)=false;          id(pc_auto_edit)=-1;
          id(pc_dirty)=true;
      - script.execute: pc_refresh

  # Premendo ANNULLA oppure ruotando si sospende l'automazione.
  - id: pc_auto_cancel
