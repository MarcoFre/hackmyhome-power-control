          };
          const float values[14] = {
            id(pc_w_01).state,
            id(pc_w_02).state,
            id(pc_w_03).state,
            id(pc_w_04).state,
            id(pc_w_05).state,
            id(pc_w_06).state,
            id(pc_w_07).state,
            id(pc_w_08).state,
