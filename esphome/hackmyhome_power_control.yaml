          };
          int *colors[14] = {&id(pc_color_01), &id(pc_color_02), &id(pc_color_03), &id(pc_color_04), &id(pc_color_05), &id(pc_color_06), &id(pc_color_07), &id(pc_color_08), &id(pc_color_09), &id(pc_color_10), &id(pc_color_11), &id(pc_color_12), &id(pc_color_13), &id(pc_color_14)};
          int *priorities[14] = {&id(pc_priority_01), &id(pc_priority_02), &id(pc_priority_03), &id(pc_priority_04), &id(pc_priority_05), &id(pc_priority_06), &id(pc_priority_07), &id(pc_priority_08), &id(pc_priority_09), &id(pc_priority_10), &id(pc_priority_11), &id(pc_priority_12), &id(pc_priority_13), &id(pc_priority_14)};
          // Palette modificabile dal Setup. "Altro" rimane grigio.
          const uint32_t palette[14] = {
            0x38BDF8,0xF97316,0xA78BFA,0x22C55E,0xF43F5E,
            0xEAB308,0x14B8A6,0x60A5FA,0xD946EF,0xFB7185,
            0x84CC16,0xF59E0B,0x06B6D4,0xC084FC
          };
          // Stato letto direttamente da HA, senza automazioni push.
          // Ogni slot dispone del suo stato nativo; i placeholder sono monitor-only.
          const std::string states[14] = {
            id(pc_control_state_01).state,
            id(pc_control_state_02).state,
            id(pc_control_state_03).state,
            id(pc_control_state_04).state,
            id(pc_control_state_05).state,
            id(pc_control_state_06).state,
            id(pc_control_state_07).state,
            id(pc_control_state_08).state,
            id(pc_control_state_09).state,
            id(pc_control_state_10).state,
            id(pc_control_state_11).state,
            id(pc_control_state_12).state,
            id(pc_control_state_13).state,
            id(pc_control_state_14).state
          };
          bool configured[14], home_active[14];
          float measured[14];
          for (int i=0;i<14;i++) {
            configured[i] = strncmp(entities[i], "sensor.pc_non_configurato_", 26) != 0;
            float w = configured[i] && std::isfinite(values[i]) && values[i] >= 0
                      ? values[i] : 0.0f;
            if (!configured[i]) home_active[i] = false;
            else if ((controls[i][0] == '\0' || strncmp(controls[i], "switch.pc_non_configurato_", 26) == 0)) home_active[i] = w > 0.0f;
            else if (strncmp(controls[i], "climate.", 8) == 0) {
              const auto &st=states[i];
              home_active[i] = !st.empty() && st != "off" && st != "unknown" && st != "unavailable";
            } else home_active[i] = states[i] == "on";
            // Solo i dispositivi visibili partecipano alla composizione dell'anello;
            // le misure degli altri restano assorbite dalla quota "Altro".
            measured[i] = home_active[i] ? w : 0.0f;
          }
          // In Elenco e Setup si possono sempre selezionare gli slot configurati.
          if (!configured[id(pc_selected)]) {
            for (int i=0;i<14;i++) if (configured[i]) { id(pc_selected)=i; break; }
          }
          int s = id(pc_selected);
          bool total_ok = std::isfinite(id(pc_home_w).state) && id(pc_home_w).state >= 0;
          float home = total_ok ? id(pc_home_w).state : 0.0f;
          float listed = 0.0f;
          for (float w:measured) listed += w;
          float other = std::max(0.0f, home - listed);
          if (!total_ok) {
            if (std::isfinite(id(pc_other_w).state)) id(pc_other_w).publish_state(NAN);
          } else if (!std::isfinite(id(pc_other_w).state) ||
                     fabsf(id(pc_other_w).state-other)>=1.0f ||
                     id(pc_learn_last_publish_ms)!=id(pc_auto_last_power_data_ms)) {
            id(pc_other_w).publish_state(other);
