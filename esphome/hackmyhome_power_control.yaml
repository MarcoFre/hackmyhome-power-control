            "${appliance_06_sensor}",
            "${appliance_07_sensor}",
            "${appliance_08_sensor}",
            "${appliance_09_sensor}",
            "${appliance_10_sensor}",
            "${appliance_11_sensor}",
            "${appliance_12_sensor}",
            "${appliance_13_sensor}",
            "${appliance_14_sensor}"
          };
          int next = id(pc_selected);
          for (int k=0;k<14;k++) {
            next = (next + delta + 14) % 14;
