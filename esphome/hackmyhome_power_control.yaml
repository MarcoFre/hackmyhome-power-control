# ===============================================================
# HackMyHome / Power Control 0.22.4 - Waveshare Knob Touch LCD 1.8
# SOLO Power Control: Home / Elettrodomestici / Priorita / Colori / OTA
# AUTO DISTACCO: inizialmente DISABILITATO. Per abilitarlo usare la pagina
# IMPOSTAZIONI; non usare per carichi essenziali, critici o non interrompibili.
# ===============================================================
substitutions:
  device_name: power-control
  friendly_name: "Power Control"
  fw_version: "0.22.4"
  # Credenziali lette da secrets.yaml.
  password: !secret wifi_password
  api_key: !secret api_encryption_key
  ssid: !secret wifi_ssid
  # Rete in DHCP per impostazione predefinita.
  # Adatta gli entity_id seguenti alla tua installazione Home Assistant.
  power_sensor_entity: "sensor.potenza_rcb_somma_rcb0_rcb1"
  power_home_name: "CONSUMO CASA"
  power_limit_w: "3300"
  power_warning_w: "2700"
  power_critical_w: "3200"
  # Rientro richiesto per riarmare la vibrazione dopo una soglia.
  power_haptic_hysteresis_w: "100"
  # APPRENDIMENTO: parametri fissi. La soglia minima e regolabile dal Knob in IMPOSTAZIONI.
  learning_stability_w: "20"
  learning_prompt_timeout_s: "120"
  learning_cooldown_s: "120"
  # 01 - Lavatrice
  appliance_01_name: "Lavatrice"
  appliance_01_sensor: "sensor.lavatrice_power_2"
  appliance_01_switch: "switch.lavatrice_switch_1"
  # 02 - Lavastoviglie
  appliance_02_name: "Lavastoviglie"
  appliance_02_sensor: "sensor.esphome_lavastoviglie_potenza"
  appliance_02_switch: "switch.cucina_lavastoviglie_relay"
  # 03 - Macchina caffe
  appliance_03_name: "Macchina Caffe"
  appliance_03_sensor: "sensor.macchina_caffe_potenza"
  appliance_03_switch: "switch.macchina_caffe_interruttore"
  # 04 - Forno elettrico
  appliance_04_name: "Forno elettrico"
  appliance_04_sensor: "sensor.smart_plug_power"
  appliance_04_switch: "switch.smart_plug_socket_1"
  # 05 - Colonna Camera
  appliance_05_name: "Colonna Camera"
  appliance_05_sensor: "sensor.esphome_colonna_camera_potenza"
  appliance_05_switch: "switch.esphome_colonna_camera_relay"
  # 06 - Colonna Cameretta
  appliance_06_name: "Colonna Cameretta"
  appliance_06_sensor: "sensor.esphome_colonna_cameretta_potenza"
  appliance_06_switch: "switch.esphome_colonna_cameretta_relay"
  # 07 - Colonna Cucina
  appliance_07_name: "Colonna Cucina"
  appliance_07_sensor: "sensor.esphome_colonna_cucina_potenza"
  appliance_07_switch: "switch.esphome_colonna_cucina_stato_relay"
  # 08 - Colonna Sala
  appliance_08_name: "Colonna Sala"
  appliance_08_sensor: "sensor.esphome_colonna_sala_potenza"
  appliance_08_switch: "switch.esphome_colonna_sala_relay"
  # 09 - Condizionatore Cucina
  appliance_09_name: "Condizionatore Cucina"
  appliance_09_sensor: "sensor.condizionatore_cucina_consumo_immediato"
  appliance_09_switch: "climate.condizionatore_cucina"
  # 10 - Condizionatore Sala
  appliance_10_name: "Condizionatore Sala"
  appliance_10_sensor: "sensor.condizionatore_sala_consumo_immediato"
  appliance_10_switch: "climate.condizionatore_sala"
  # 11 - Apple iMac
  appliance_11_name: "Apple iMac"
  appliance_11_sensor: "sensor.imac_potenza"
  appliance_11_switch: "switch.imac"
  # 12 - Colonna Rete
  appliance_12_name: "Colonna Rete"
  appliance_12_sensor: "sensor.rete_potenza"
  appliance_12_switch: "switch.rete_presa"
  # 13 - Frigorifero
  appliance_13_name: "Frigorifero"
  appliance_13_sensor: "sensor.frigorifero_power"
  appliance_13_switch: "switch.frigorifero"
  # 14 - Personalizzato 1
  appliance_14_name: "Personalizzato 1"
  appliance_14_sensor: "sensor.pc_non_configurato_14"
  appliance_14_switch: "switch.pc_non_configurato_14"

  lcd_clk: GPIO13
  lcd_cs: GPIO14
  lcd_d0: GPIO15
  lcd_d1: GPIO16
  lcd_d2: GPIO17
  lcd_d3: GPIO18
  lcd_reset: GPIO21
  lcd_backlight: GPIO47
  touch_sda: GPIO11
  touch_scl: GPIO12
  touch_int: GPIO9
  touch_reset: GPIO10
  battery_adc_pin: GPIO1
  encoder_a: GPIO8
  encoder_b: GPIO7

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "HackMyHome Power Control 0.22 - AUTO + Apprendimento locale"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // Una sola volta: nella v0.20 CLIMA AUTO poteva vietare
          // i climatizzatori anche se il loro Axx era ON. Non ampliare
          // i permessi senza un nuovo SI esplicito nella lista DISTACCO.
          if (!id(pc_upgrade_021_done)) {
            // Modifica della logica AUTO/NO AUTO: richiede nuova abilitazione
            // generale da IMPOSTAZIONI dopo avere verificato la lista.
            id(pc_auto_enabled)=0;
            id(pc_auto_mode)=0;
            if (!id(pc_auto_climate)) {
              if (strncmp("${appliance_01_switch}", "climate.", 8)==0) id(pc_auto_allow_01)=0;
              if (strncmp("${appliance_02_switch}", "climate.", 8)==0) id(pc_auto_allow_02)=0;
              if (strncmp("${appliance_03_switch}", "climate.", 8)==0) id(pc_auto_allow_03)=0;
              if (strncmp("${appliance_04_switch}", "climate.", 8)==0) id(pc_auto_allow_04)=0;
              if (strncmp("${appliance_05_switch}", "climate.", 8)==0) id(pc_auto_allow_05)=0;
              if (strncmp("${appliance_06_switch}", "climate.", 8)==0) id(pc_auto_allow_06)=0;
              if (strncmp("${appliance_07_switch}", "climate.", 8)==0) id(pc_auto_allow_07)=0;
              if (strncmp("${appliance_08_switch}", "climate.", 8)==0) id(pc_auto_allow_08)=0;
              if (strncmp("${appliance_09_switch}", "climate.", 8)==0) id(pc_auto_allow_09)=0;
              if (strncmp("${appliance_10_switch}", "climate.", 8)==0) id(pc_auto_allow_10)=0;
              if (strncmp("${appliance_11_switch}", "climate.", 8)==0) id(pc_auto_allow_11)=0;
              if (strncmp("${appliance_12_switch}", "climate.", 8)==0) id(pc_auto_allow_12)=0;
              if (strncmp("${appliance_13_switch}", "climate.", 8)==0) id(pc_auto_allow_13)=0;
              if (strncmp("${appliance_14_switch}", "climate.", 8)==0) id(pc_auto_allow_14)=0;
            }
            id(pc_upgrade_021_done)=1;
          }

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

wifi:
  id: pc_wifi
  ssid: ${ssid}
  password: ${password}
  reboot_timeout: 10min
  # Se usi IP statico, imposta IP e gateway nella STESSA sottorete.
  # manual_ip:
  #   static_ip: 192.168.1.91
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

preferences:
  # Le priorita' vengono cambiate solo dopo 3s di inattivita'.
  # Quindi non scriviamo in flash a ogni scatto della manopola.
  flash_write_interval: 0s

logger:
  level: WARN

api:
  id: pc_api
  encryption:
    key: ${api_key}
  on_client_connected:
    then:
      - lambda: 'id(pc_dirty) = true;'

ota:
  - platform: esphome
    # OTA crittografato: usa la chiave gia impostata in api.encryption.key.
    encryption:
    on_begin:
      then:
        - lambda: |-
            id(pc_ota) = true;
            id(pc_auto_mode) = 0;
            id(pc_auto_overlay_open) = false;
            id(pc_boot_active) = false;  // Durante OTA nessun ticker o polling boot.
            id(pc_ota_error) = false;
            id(pc_ota_percent) = -1;
        - lvgl.page.show:
            id: ota_page
            animation: NONE
        - lambda: |-
            lv_label_set_text(id(ota_status), "AGGIORNAMENTO OTA");
            lv_label_set_text(id(ota_percent_label), "0%");
            lv_bar_set_value(id(ota_bar), 0, LV_ANIM_OFF);
            lv_refr_now(NULL);
    on_progress:
      then:
        - lambda: |-
            // Refresh immediato: durante OTA il loop normale e' bloccato.
            // Non fare operazioni grafiche pesanti a ogni pacchetto.
            int pct = (int) fmaxf(0.0f, fminf(100.0f, x));
            if (pct == id(pc_ota_percent) ||
                (pct < 100 && pct < id(pc_ota_percent) + 5)) return;
            id(pc_ota_percent) = pct;
            lv_bar_set_value(id(ota_bar), pct, LV_ANIM_OFF);
            char msg[8]; snprintf(msg, sizeof(msg), "%d%%", pct);
            lv_label_set_text(id(ota_percent_label), msg);
            lv_refr_now(NULL);
    on_end:
      then:
        - lambda: |-
            lv_bar_set_value(id(ota_bar), 100, LV_ANIM_OFF);
            lv_label_set_text(id(ota_percent_label), "100%");
            lv_label_set_text(id(ota_status), "COMPLETATO");
            lv_refr_now(NULL);
            // ESPHome gestisce il riavvio dopo OTA riuscito.
    on_error:
      then:
        - lambda: |-
            id(pc_ota_error) = true;
            id(pc_ota_failed_ms) = millis();
            lv_label_set_text(id(ota_status), "ERRORE OTA");
            lv_refr_now(NULL);
            // Rientro automatico gestito da interval, senza delay bloccanti.

safe_mode:

captive_portal:

# Il Knob dispone del DRV2605 (I2C 0x5A); usa il driver del firmware originale.
# Il componente esterno viene scaricato durante la compilazione ESPHome.
external_components:
  - source: github://RAR/esphome-drv2605
    components: [drv2605]
    refresh: 1d

i2c:
  id: i2c_bus
  sda: ${touch_sda}
  scl: ${touch_scl}
  scan: false
  frequency: 400kHz

# Attuatore aptico integrato nel Waveshare, sullo stesso bus del touch.
# Configurazione LRA e libreria 6 gia' usata nel firmware originale.
drv2605:
  id: pc_haptic_driver
  i2c_id: i2c_bus
  address: 0x5A
  motor_type: LRA
  library: 6

spi:
  id: display_qspi
  type: quad
  clk_pin: ${lcd_clk}
  data_pins:
    - ${lcd_d0}
    - ${lcd_d1}
    - ${lcd_d2}
    - ${lcd_d3}

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    spi_id: display_qspi
    bus_mode: quad
    cs_pin: ${lcd_cs}
    reset_pin: ${lcd_reset}
    data_rate: 80MHz
    color_order: rgb
    invert_colors: true
    rotation: 0
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 360
      height: 360

touchscreen:
  - platform: cst816
    id: knob_touch
    display: main_display
    i2c_id: i2c_bus
    interrupt_pin: ${touch_int}
    reset_pin: ${touch_reset}
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false

output:
  - platform: ledc
    id: backlight_pwm
    pin: ${lcd_backlight}
    frequency: 1000Hz
light:
  - platform: monochromatic
    id: display_backlight
    name: "${friendly_name} Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 0ms

globals:
  # Soglia persistente: solo gli AUMENTI di Altri (non il suo valore assoluto).
  # Modificabile nella pagina IMPOSTAZIONI; default 50 W, range 10..500, step 5 W.
  - id: pc_learn_min_rise_w
    type: int
    restore_value: yes
    initial_value: "50"
  # I profili sono solo diagnostici: MAI usati per comandare il distacco.
  # Chiave = (indice elettrodomestico + 1)*100 + indice modalita + 1.
  - id: pc_learn_keys
    type: std::array<int, 32>
    restore_value: yes
    initial_value: 'std::array<int, 32>{}'
  - id: pc_learn_means
    type: std::array<float, 32>
    restore_value: yes
    initial_value: 'std::array<float, 32>{}'
  - id: pc_learn_counts
    type: std::array<int, 32>
    restore_value: yes
    initial_value: 'std::array<int, 32>{}'
  - id: pc_learn_base
    type: float
    initial_value: '0.0f'
  - id: pc_learn_base_ready
    type: bool
    initial_value: 'false'
  - id: pc_learn_streak
    type: int
    initial_value: '0'
  - id: pc_learn_first_delta
    type: float
    initial_value: '0.0f'
  - id: pc_learn_candidate_w
    type: float
    initial_value: '0.0f'
  - id: pc_learn_pending
    type: bool
    initial_value: 'false'
  - id: pc_learn_new_prompt
    type: bool
    initial_value: 'false'
  - id: pc_learn_since_ms
    type: uint32_t
    initial_value: '0'
  - id: pc_learn_cooldown_until_ms
    type: uint32_t
    initial_value: '0'
  - id: pc_learn_last_sample_ms
    type: uint32_t
    initial_value: '0'
  - id: pc_learn_last_publish_ms
    type: uint32_t
    initial_value: '0'
  - id: pc_learn_last_key
    type: int
    initial_value: '0'
  - id: pc_learn_last_confirm_ms
    type: uint32_t
    initial_value: '0'
  - id: pc_learn_last_confirm_w
    type: float
    initial_value: '0.0f'
  - id: pc_learn_device_idx
    type: int
    initial_value: '0'
  - id: pc_learn_mode_idx
    type: int
    initial_value: '0'
  - id: pc_learn_mode_count
    type: int
    initial_value: '7'
  - id: pc_learn_edit_stage
    type: int
    initial_value: '0'
  # -1: primo valore non ancora acquisito. Le altre zone sono
  # 0=normale, 1=attenzione, 2=critica. Nessun avviso sul primo dato.
  - id: pc_haptic_zone
    type: int
    initial_value: "-1"
  # 0=nessun impulso; 1=breve; 2=doppio. Transitorio, NON persistente.
  - id: pc_haptic_event
    type: int
    initial_value: "0"
  - id: pc_dirty
    type: bool
    initial_value: "true"
  - id: pc_ota
    type: bool
    initial_value: "false"
  - id: pc_ota_error
    type: bool
    initial_value: "false"
  - id: pc_ota_percent
    type: int
    initial_value: "-1"
  - id: pc_ota_failed_ms
    type: uint32_t
    initial_value: "0"
  # BOOT: progresso legato a Wi-Fi, sessione API con stati e primo valore HA.
  # Se HA non risponde, dopo 30s entra comunque nella Home (modalita' offline).
  - id: pc_boot_active
    type: bool
    initial_value: "true"
  - id: pc_boot_ui_ready
    type: bool
    initial_value: "false"
  - id: pc_boot_start_ms
    type: uint32_t
    initial_value: "0"
  - id: pc_boot_ready_ms
    type: uint32_t
    initial_value: "0"
  - id: pc_boot_ticker_x
    type: int
    initial_value: "320"
  - id: pc_boot_progress_last
    type: int
    initial_value: "-1"
  - id: pc_boot_step_last
    type: int
    initial_value: "-1"
  - id: pc_boot_handoff_pending
    type: bool
    initial_value: "false"
  # Cache per evitare di ridisegnare la barra di stato se i valori sono invariati.
  - id: pc_status_battery_last
    type: int
    initial_value: "-999"
  - id: pc_status_wifi_last
    type: int
    initial_value: "-999"
  - id: pc_status_bars_last
    type: int
    initial_value: "-1"
  - id: pc_status_ha_last
    type: int
    initial_value: "-1"
  # 0=Home, 1=Distacco, 2=Elettrodomestici, 3=Colori, 4=Impostazioni, 5=Conferma
  - id: pc_page
    type: int
    initial_value: "0"
  - id: pc_selected
    type: int
    initial_value: "0"
  # False = Home mostra automaticamente il carico attivo maggiore.
  # True = Home mantiene la selezione esplicita finche' il dispositivo e' attivo.
  - id: pc_home_selection_explicit
    type: bool
    initial_value: "false"
  # Selezione del segmento grigio: NON e' uno slot e non puo' ricevere ON/OFF.
  # pc_selected rimane sempre un indice valido di elettrodomestico (0..13).
  - id: pc_home_other_selected
    type: bool
    initial_value: "false"
  # Stato lista priorita': ordine provvisorio (solo dispositivi configurati e comandabili).
  # La variabile NON e' persistente: i singoli pc_priority_XX lo sono gia'.
  - id: pc_prio_order
    type: std::vector<int>
    initial_value: "std::vector<int>{}"
  - id: pc_prio_cursor
    type: int
    initial_value: "0"
  - id: pc_prio_top
    type: int
    initial_value: "0"
  # -1: ruotare scorre la lista; >=0: lo slot selezionato si sposta.
  - id: pc_prio_edit_slot
    type: int
    initial_value: "-1"
  - id: pc_prio_pending
    type: bool
    initial_value: "false"
  - id: pc_prio_last_move_ms
    type: uint32_t
    initial_value: "0"
  - id: pc_prio_saved_ms
    type: uint32_t
    initial_value: "0"
  # Conferma esplicita di esclusione/riabilitazione (mai per timeout).
  # 0=nessuna, 1=escludi (NO AUTO), 2=riabilita (AUTO).
  - id: pc_prio_prompt_mode
    type: int
    initial_value: "0"
  - id: pc_prio_prompt_slot
    type: int
    initial_value: "-1"
  - id: pc_prio_prompt_since_ms
    type: uint32_t
    initial_value: "0"
  # Setup colori: elenco alfabetico di TUTTI gli slot con sensore configurato.
  # Colore provvisorio separato dai pc_color_XX persistenti: commit dopo 3s.
  - id: pc_color_order
    type: std::vector<int>
    initial_value: "std::vector<int>{}"
  - id: pc_color_cursor
    type: int
    initial_value: "0"
  - id: pc_color_top
    type: int
    initial_value: "0"
  - id: pc_color_edit_slot
    type: int
    initial_value: "-1"
  - id: pc_color_draft
    type: int
    initial_value: "0"
  - id: pc_color_pending
    type: bool
    initial_value: "false"
  - id: pc_color_last_move_ms
    type: uint32_t
    initial_value: "0"
  - id: pc_color_saved_ms
    type: uint32_t
    initial_value: "0"
  - id: pc_last_knob_ms
    type: uint32_t
    initial_value: "0"
  # Ritorno Home dopo 60s senza touch, swipe o rotazione (mai durante OTA/boot).
  - id: pc_last_activity_ms
    type: uint32_t
    initial_value: "0"
  # Distacco: impostazioni persistenti, inizialmente INATTIVO.
  - id: pc_auto_enabled
    type: int
    restore_value: yes
    initial_value: "0"
  - id: pc_auto_yellow
    type: int
    restore_value: yes
    initial_value: "0"
  - id: pc_auto_red
    type: int
    restore_value: yes
    initial_value: "1"
  - id: pc_auto_delay_s
    type: int
    restore_value: yes
    initial_value: "5"
  - id: pc_auto_confirm_s
    type: int
    restore_value: yes
    initial_value: "12"
  - id: pc_auto_suspend_s
    type: int
    restore_value: yes
    initial_value: "120"
  - id: pc_auto_after_s
    type: int
    restore_value: yes
    initial_value: "25"
  # VECCHIA impostazione: solo per migrazione dei permessi climate.
  - id: pc_auto_climate
    type: int
    restore_value: yes
    initial_value: "0"
  - id: pc_upgrade_021_done
    type: int
    restore_value: yes
    initial_value: "0"
  - id: pc_auto_allow_01
    type: int
    restore_value: yes
    initial_value: "0"
  - id: pc_auto_allow_02
    type: int
    restore_value: yes
    initial_value: "0"
  - id: pc_auto_allow_03
    type: int
