# La lettura e' nativa: nessuna automazione HA che spinge continuamente W.
sensor:
  # Il valore e' pubblicato DALLO STESSO CALCOLO che disegna il segmento Altri.
  - platform: template
    id: pc_other_w
    name: "Power Control Potenza Altri"
    icon: mdi:flash-outline
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  # Lettura batteria gia' utilizzata nel firmware hardware originale del Knob.
  # GPIO1 misura la tensione attraverso un partitore: tensione batteria = ADC * 2.
  - platform: adc
    id: pc_battery_voltage
    pin: ${battery_adc_pin}
    attenuation: 12db
    update_interval: 30s
    internal: true
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  # Percentuale indicativa LiPo 1S, non e' una misura del livello di carica esatto.
  - platform: template
    id: pc_battery_percent
    name: "${friendly_name} Batteria"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float v = id(pc_battery_voltage).state;
      if (!std::isfinite(v)) return NAN;
      return fmaxf(0.0f, fminf(100.0f, (v - 3.0f) * (100.0f / 1.2f)));

  - platform: wifi_signal
    id: pc_wifi_rssi
    internal: true
    update_interval: 15s

  - platform: homeassistant
    id: pc_home_w
    entity_id: ${power_sensor_entity}
    internal: true
    on_value:
      then:
        - lambda: 'id(pc_dirty) = true; id(pc_auto_last_power_data_ms) = millis();'
        - script.execute: pc_haptic_check
