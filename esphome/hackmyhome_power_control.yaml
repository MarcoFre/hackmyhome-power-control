                - if:
                    condition:
                      lambda: |-
                        if (id(pc_ota)) return false;
                        const char *controls[14] = {
                          "${appliance_01_switch}",
                          "${appliance_02_switch}",
                          "${appliance_03_switch}",
                          "${appliance_04_switch}",
                          "${appliance_05_switch}",
                          "${appliance_06_switch}",
