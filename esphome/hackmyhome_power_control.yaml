              // arrotondamento degli altri segmenti finiscono qui).
              const int span=ARC_SWEEP-used_angle;
              const int a0=(ARC_START+used_angle)%360;
              const int a1=(ARC_START+used_angle+span)%360;
              lv_arc_set_bg_angles(id(pc_seg_other),a0,a1);
              lv_obj_set_style_arc_color(id(pc_seg_other),lv_color_hex(0x64748B),LV_PART_MAIN);
              lv_obj_remove_flag(id(pc_seg_other),LV_OBJ_FLAG_HIDDEN);
              if (id(pc_home_other_selected)) {
                selected_start=a0;
                selected_end=a1;
              }
              used_angle+=span;
            }

            // Anello sottile centrale: evidenzia esclusivamente il dispositivo selezionato.
            if (selected_start>=0 && selected_end>=0) {
              lv_arc_set_bg_angles(id(pc_selected_arc),selected_start,selected_end);
              lv_obj_set_style_arc_color(id(pc_selected_arc),
                lv_color_hex(id(pc_home_other_selected) ? 0x94A3B8 : palette[*colors[s]%14]),LV_PART_MAIN);
              lv_obj_remove_flag(id(pc_selected_arc),LV_OBJ_FLAG_HIDDEN);
            }

            if (id(pc_home_other_selected) && gray_available) {
              lv_label_set_text(id(pc_selected_name),"ALTRI CONSUMI");
              snprintf(tmp,sizeof(tmp),"%.0f W  |  %.0f%%",other,
                denominator>0 ? 100.0f*other/denominator : 0.0f);
              lv_label_set_text(id(pc_selected_power),tmp);
              lv_obj_set_style_text_color(id(pc_selected_name),lv_color_hex(0x94A3B8),LV_PART_MAIN);
            } else if (count>0 && home_active[s]) {
              snprintf(tmp,sizeof(tmp),"%s", names[s]);
              lv_label_set_text(id(pc_selected_name),tmp);
              if (std::isfinite(values[s]) && values[s]>=0)
                snprintf(tmp,sizeof(tmp),"%.0f W  |  %.0f%%",values[s],denominator>0?100.0f*values[s]/denominator:0.0f);
              else snprintf(tmp,sizeof(tmp),"Consumo N/D");
              lv_label_set_text(id(pc_selected_power),tmp);
              lv_obj_set_style_text_color(id(pc_selected_name),lv_color_hex(palette[*colors[s]%14]),LV_PART_MAIN);
            } else {
              lv_label_set_text(id(pc_selected_name),"Nessun dispositivo attivo");
              lv_label_set_text(id(pc_selected_power),total_ok ? "0 W" : "-- W");
            }
            if (total_ok && listed>home+25)
              lv_label_set_text(id(pc_note),"Somma sensori > totale");
            else lv_label_set_text(id(pc_note),"GRIGIO = ALTRI CONSUMI");
          } else if (id(pc_page)==2) {
            // Sfondo colorato in tono scuro: 75% blu notte + 25% colore
            // scelto nello Setup. Testi chiari anche con tinte molto vivaci.
            const uint32_t accent = configured[s]
              ? palette[((*colors[s] % 14) + 14) % 14] : 0x020617;
            const uint32_t base = 0x020617;
            const uint32_t br = (((base >> 16) & 0xFF) * 75 + ((accent >> 16) & 0xFF) * 25) / 100;
            const uint32_t bg = (((base >> 8) & 0xFF) * 75 + ((accent >> 8) & 0xFF) * 25) / 100;
            const uint32_t bb = ((base & 0xFF) * 75 + (accent & 0xFF) * 25) / 100;
            const uint32_t detail_bg = (br << 16) | (bg << 8) | bb;
            // Non ridisegnare lo sfondo quando il colore non e' cambiato.
            static uint32_t last_detail_bg = 0xFFFFFFFF;
            if (detail_bg != last_detail_bg) {
              lv_obj_set_style_bg_color(id(appliances_page)->obj, lv_color_hex(detail_bg), LV_PART_MAIN);
              last_detail_bg = detail_bg;
            }
            lv_label_set_text(id(pc_device_name),configured[s]?names[s]:"NESSUN DISPOSITIVO");
            lv_obj_set_style_text_color(id(pc_device_name), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
            if (configured[s] && std::isfinite(values[s]) && values[s]>=0)
              snprintf(tmp,sizeof(tmp),"%.0f W",values[s]);
            else snprintf(tmp,sizeof(tmp),"Consumo N/D");
            lv_label_set_text(id(pc_device_power),tmp);
            snprintf(tmp,sizeof(tmp),"PRIORITA' %d / 14",*priorities[s]);
            lv_label_set_text(id(pc_device_priority),tmp);
            lv_label_set_text(id(pc_control_type),(controls[s][0] && strncmp(controls[s], "switch.pc_non_configurato_", 26) != 0) ?
              (strncmp(controls[s],"climate.",8)==0 ? "CLIMA | TIENI PREMUTO" : "SWITCH | TIENI PREMUTO")
              : "SOLO MONITORAGGIO | nessun comando");
          } else if (id(pc_page)==1) {
            const auto &order=id(pc_prio_order);
            const int n=(int)order.size();
            if (n == 0) {
              lv_label_set_text(id(pc_prio_hint),"NESSUN DISPOSITIVO COMANDABILE");
            } else if (id(pc_prio_edit_slot)>=0) {
              lv_label_set_text(id(pc_prio_hint),"GIU: NO AUTO | SU: AUTO");
            } else if (id(pc_prio_saved_ms)!=0 && millis()-id(pc_prio_saved_ms)<1800) {
              lv_label_set_text(id(pc_prio_hint),"PRIORITA' SALVATE");
            } else {
              lv_label_set_text(id(pc_prio_hint),"RUOTA: SCORRI | TOCCA: SPOSTA");
            }
            lv_obj_t *buttons[4]={id(pc_prio_btn_0),id(pc_prio_btn_1),id(pc_prio_btn_2),id(pc_prio_btn_3)};
            lv_obj_t *labels[4]={id(pc_prio_row_0),id(pc_prio_row_1),id(pc_prio_row_2),id(pc_prio_row_3)};
            lv_obj_t *badges[4]={id(pc_prio_badge_0),id(pc_prio_badge_1),id(pc_prio_badge_2),id(pc_prio_badge_3)};
            for (int row=0;row<4;row++) {
              const int pos=id(pc_prio_top)+row;
              if (pos>=n) { lv_obj_add_flag(buttons[row],LV_OBJ_FLAG_HIDDEN); continue; }
              lv_obj_remove_flag(buttons[row],LV_OBJ_FLAG_HIDDEN);
              const int slot=order[pos];
              const int allow[14]={id(pc_auto_allow_01),id(pc_auto_allow_02),id(pc_auto_allow_03),id(pc_auto_allow_04),
                id(pc_auto_allow_05),id(pc_auto_allow_06),id(pc_auto_allow_07),id(pc_auto_allow_08),
                id(pc_auto_allow_09),id(pc_auto_allow_10),id(pc_auto_allow_11),id(pc_auto_allow_12),
                id(pc_auto_allow_13),id(pc_auto_allow_14)};
              snprintf(tmp,sizeof(tmp),"%02d %.17s",pos+1,names[slot]);
              lv_label_set_text(labels[row],tmp);
              lv_label_set_text(badges[row],allow[slot]?"":"NO AUTO");
              const bool editing=(id(pc_prio_edit_slot)==slot);
              const bool cursor=(id(pc_prio_cursor)==pos);
              const uint32_t bg=editing?0x115E59:cursor?0x1E3A5F:allow[slot]?0x0F172A:0x29202A;
              const uint32_t border=editing?0x22C55E:cursor?0x38BDF8:allow[slot]?0x334155:0x7F1D1D;
              lv_obj_set_style_bg_color(buttons[row],lv_color_hex(bg),LV_PART_MAIN);
              lv_obj_set_style_border_color(buttons[row],lv_color_hex(border),LV_PART_MAIN);
              lv_obj_set_style_text_color(labels[row],lv_color_hex(editing?0x86EFAC:0xE2E8F0),LV_PART_MAIN);
            }
          } else if (id(pc_page)==3) {
            const auto &order=id(pc_color_order);
            const int n=(int)order.size();
            const bool editing=id(pc_color_edit_slot)>=0;
            if (n==0) lv_label_set_text(id(pc_color_hint),"NESSUN DISPOSITIVO CONFIGURATO");
            else if (editing) lv_label_set_text(id(pc_color_hint),"RUOTA: CAMBIA COLORE");
            else if (id(pc_color_saved_ms)!=0 && millis()-id(pc_color_saved_ms)<1800)
              lv_label_set_text(id(pc_color_hint),"COLORE SALVATO");
            else lv_label_set_text(id(pc_color_hint),"RUOTA: SCORRI | TOCCA: MODIFICA");
            lv_obj_t *buttons[4]={id(pc_color_btn_0),id(pc_color_btn_1),id(pc_color_btn_2),id(pc_color_btn_3)};
            lv_obj_t *labels[4]={id(pc_color_row_0),id(pc_color_row_1),id(pc_color_row_2),id(pc_color_row_3)};
            for (int row=0;row<4;row++) {
              const int pos=id(pc_color_top)+row;
              if (pos>=n) { lv_obj_add_flag(buttons[row],LV_OBJ_FLAG_HIDDEN); continue; }
              lv_obj_remove_flag(buttons[row],LV_OBJ_FLAG_HIDDEN);
              const int slot=order[pos];
              const bool is_editing=(id(pc_color_edit_slot)==slot);
              const int cidx=is_editing ? id(pc_color_draft) : *colors[slot];
              const uint32_t color=palette[(cidx%14+14)%14];
              snprintf(tmp,sizeof(tmp),"%02d  %s",pos+1,names[slot]);
              lv_label_set_text(labels[row],tmp);
              lv_obj_set_style_bg_color(buttons[row],lv_color_hex(color),LV_PART_MAIN);
              lv_obj_set_style_border_color(buttons[row],lv_color_hex(is_editing?0xFFFFFF:
                id(pc_color_cursor)==pos?0x38BDF8:color),LV_PART_MAIN);
              lv_obj_set_style_border_width(buttons[row],is_editing?3:2,LV_PART_MAIN);
              const uint32_t r=(color>>16)&0xFF, g=(color>>8)&0xFF, b=color&0xFF;
              const uint32_t luminosity=(r*299+g*587+b*114)/1000;
              lv_obj_set_style_text_color(labels[row],lv_color_hex(luminosity>160?0x020617:0xFFFFFF),LV_PART_MAIN);
            }
          } else if (id(pc_page)==4) {
            const char *titles[8]={"AUTOMATICO","ZONA GIALLA","ZONA ROSSA","RITARDO","CONFERMA","SOSPENSIONE","DOPO DISTACCO","SOGLIA APPREND."};
            const int values[8]={id(pc_auto_enabled),id(pc_auto_yellow),id(pc_auto_red),
              id(pc_auto_delay_s),id(pc_auto_confirm_s),id(pc_auto_suspend_s),id(pc_auto_after_s),
              id(pc_learn_min_rise_w)};
            lv_obj_t *buttons[4]={id(pc_auto_btn_0),id(pc_auto_btn_1),id(pc_auto_btn_2),id(pc_auto_btn_3)};
            lv_obj_t *labels[4]={id(pc_auto_row_0),id(pc_auto_row_1),id(pc_auto_row_2),id(pc_auto_row_3)};
            for (int row=0;row<4;row++) {
              const int n=id(pc_auto_top)+row;
              if (n>=8) { lv_obj_add_flag(buttons[row],LV_OBJ_FLAG_HIDDEN); continue; }
              lv_obj_remove_flag(buttons[row],LV_OBJ_FLAG_HIDDEN);
              const bool editing=id(pc_auto_edit)==n;
              const int v=editing?id(pc_auto_draft):values[n];
              if (n==0 || n==1 || n==2)
                snprintf(tmp,sizeof(tmp),"%s: %s",titles[n],v?"ON":"OFF");
              else if (n==7) snprintf(tmp,sizeof(tmp),"%s: %d W",titles[n],v);
              else snprintf(tmp,sizeof(tmp),"%s: %d s",titles[n],v);
              lv_label_set_text(labels[row],tmp);
              lv_obj_set_style_bg_color(buttons[row],lv_color_hex(editing?0x115E59:id(pc_auto_cursor)==n?0x1E3A5F:0x0F172A),LV_PART_MAIN);
              lv_obj_set_style_border_color(buttons[row],lv_color_hex(editing?0x22C55E:id(pc_auto_cursor)==n?0x38BDF8:0x334155),LV_PART_MAIN);
            }
            if (id(pc_auto_edit)>=0) lv_label_set_text(id(pc_auto_hint),"RUOTA: MODIFICA | SALVA DOPO 3s");
            else if (id(pc_auto_saved_ms) && millis()-id(pc_auto_saved_ms)<1800)
              lv_label_set_text(id(pc_auto_hint),"IMPOSTAZIONE SALVATA");
            else lv_label_set_text(id(pc_auto_hint),"RUOTA: SCORRI | TOCCA: MODIFICA");
          }

  # Animazione e diagnostica BOOT: chiamata a 200ms solo fino all'ingresso in Home.
  # Nessun refresh dei gauge e nessun invio continuo da Home Assistant.
  - id: pc_boot_tick
    mode: single
    then:
      - lambda: |-
          if (!id(pc_boot_active) || !id(pc_boot_ui_ready) || id(pc_ota)) return;
          const uint32_t now = millis();

          // Ticker leggero: sposta una sola label dentro un contenitore ritagliato.
          int x = id(pc_boot_ticker_x) - 12;
          if (x < -lv_obj_get_width(id(pc_boot_ticker))) x = 322;
          id(pc_boot_ticker_x) = x;
          lv_obj_set_x(id(pc_boot_ticker), x);

          // Le fasi sono REALI: una connessione di soli log non equivale ad HA.
          const bool wifi_ok = id(pc_wifi).is_connected();
          const bool api_ok = wifi_ok && id(pc_api).is_connected_with_state_subscription();
          const bool data_ok = api_ok && id(pc_home_w).has_state() &&
                               std::isfinite(id(pc_home_w).state) && id(pc_home_w).state >= 0.0f;

          int stage = 0;
          int progress = 12;
          const char *msg = "CONNESSIONE WI-FI...";
          if (wifi_ok) { stage = 1; progress = 35; msg = "CONNESSIONE HOME ASSISTANT..."; }
          if (api_ok)  { stage = 2; progress = 65; msg = "ATTESA PRIMO DATO ENERGIA..."; }
          if (data_ok) { stage = 3; progress = 100; msg = "SISTEMA PRONTO"; }

          if (progress != id(pc_boot_progress_last)) {
            lv_bar_set_value(id(pc_boot_progress), progress, LV_ANIM_OFF);
            id(pc_boot_progress_last) = progress;
          }
          if (stage != id(pc_boot_step_last)) {
            lv_label_set_text(id(pc_boot_status), msg);
            lv_label_set_text(id(pc_boot_wifi_label), wifi_ok ? "WIFI OK" : "WIFI ...");
            lv_label_set_text(id(pc_boot_api_label), api_ok ? "API OK" : "API ...");
            lv_label_set_text(id(pc_boot_data_label), data_ok ? "DATI OK" : "DATI ...");
            lv_obj_set_style_text_color(id(pc_boot_wifi_label), lv_color_hex(wifi_ok ? 0x22C55E : 0x94A3B8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(pc_boot_api_label), lv_color_hex(api_ok ? 0x22C55E : 0x94A3B8), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(pc_boot_data_label), lv_color_hex(data_ok ? 0x22C55E : 0x94A3B8), LV_PART_MAIN);
            id(pc_boot_step_last) = stage;
          }

          // Un secondo circa di pagina 'PRONTO', ma niente attesa artificiale
          // se una delle connessioni non arriva.
          if (data_ok) {
            if (id(pc_boot_ready_ms) == 0) id(pc_boot_ready_ms) = now;
            if ((uint32_t)(now - id(pc_boot_ready_ms)) >= 700 &&
                (uint32_t)(now - id(pc_boot_start_ms)) >= 1600)
              id(pc_boot_handoff_pending) = true;
          } else id(pc_boot_ready_ms) = 0;

          // Non lasciare il display intrappolato nel boot se HA e' spento.
          if ((uint32_t)(now - id(pc_boot_start_ms)) >= 30000) {
            if (!data_ok) lv_label_set_text(id(pc_boot_status), "MODALITA' OFFLINE");
            id(pc_boot_handoff_pending) = true;
          }
      - if:
          condition:
            lambda: 'return id(pc_boot_handoff_pending) && !id(pc_ota);'
          then:
            - lambda: |-
                id(pc_boot_active) = false;
                id(pc_boot_handoff_pending) = false;
                id(pc_page) = 0;
                id(pc_home_selection_explicit) = false;
                id(pc_last_activity_ms) = millis();
                id(pc_dirty) = true;
            - lvgl.page.show:
                id: power_page
                animation: NONE
            - script.execute: pc_refresh
            - script.execute: pc_status_refresh

  # Mini barra in Home. Nessun canvas, nessun refresh dei gauge.
  - id: pc_status_refresh
    mode: restart
    then:
      - lambda: |-
          if (id(pc_ota) || id(pc_boot_active) || id(pc_page) != 0) return;

          // BATTERIA: percentuale indicativa, arrotondata e aggiornata solo se diversa.
          const float battery = id(pc_battery_percent).state;
          const int battery_pct = std::isfinite(battery)
            ? (int)lroundf(fmaxf(0.0f, fminf(100.0f, battery))) : -1;
          if (battery_pct != id(pc_status_battery_last)) {
            id(pc_status_battery_last) = battery_pct;
            const uint32_t c = battery_pct < 0 ? 0x94A3B8 :
              battery_pct <= 20 ? 0xEF4444 : battery_pct <= 40 ? 0xF59E0B : 0x22C55E;
            lv_obj_set_style_bg_color(id(pc_battery_fill), lv_color_hex(c), LV_PART_MAIN);
            lv_obj_set_width(id(pc_battery_fill), battery_pct < 0 ? 1 :
              (battery_pct == 0 ? 1 : (battery_pct * 15 + 99) / 100));
            char b[8];
            if (battery_pct < 0) snprintf(b, sizeof(b), "--%%");
            else snprintf(b, sizeof(b), "%d%%", battery_pct);
            lv_label_set_text(id(pc_battery_text), b);
            lv_obj_set_style_text_color(id(pc_battery_text), lv_color_hex(c), LV_PART_MAIN);
          }

          // WIFI: barrine colorate proporzionali al segnale, grigie senza rete.
          const bool wifi_ok = id(pc_wifi).is_connected();
          const float rssi = id(pc_wifi_rssi).state;
          const int wifi_pct = wifi_ok && std::isfinite(rssi)
            ? (int)lroundf(fmaxf(0.0f, fminf(100.0f, 2.0f * (rssi + 100.0f)))) : -1;
          const int bars = wifi_pct < 0 ? 0 : wifi_pct >= 70 ? 3 : wifi_pct >= 35 ? 2 : 1;
          if (wifi_pct != id(pc_status_wifi_last) || bars != id(pc_status_bars_last)) {
            id(pc_status_wifi_last) = wifi_pct;
            id(pc_status_bars_last) = bars;
            const uint32_t good = 0x22C55E;
            const uint32_t warn = 0xF59E0B;
            const uint32_t off = 0x475569;
            const uint32_t on_color = bars == 1 ? warn : good;
            lv_obj_set_style_bg_color(id(pc_wifi_bar_1), lv_color_hex(bars>=1?on_color:off), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(pc_wifi_bar_2), lv_color_hex(bars>=2?on_color:off), LV_PART_MAIN);
            lv_obj_set_style_bg_color(id(pc_wifi_bar_3), lv_color_hex(bars>=3?on_color:off), LV_PART_MAIN);
            char w[8];
            if (wifi_pct < 0) snprintf(w, sizeof(w), "--%%");
            else snprintf(w, sizeof(w), "%d%%", wifi_pct);
            lv_label_set_text(id(pc_wifi_text), w);
          }

          // HA: client API con sottoscrizione agli stati (non un client solo log).
          const int ha_ok = id(pc_api).is_connected_with_state_subscription() ? 1 : 0;
          if (ha_ok != id(pc_status_ha_last)) {
            id(pc_status_ha_last) = ha_ok;
            const uint32_t color = ha_ok ? 0x22C55E : 0xEF4444;
            lv_obj_set_style_bg_color(id(pc_ha_dot), lv_color_hex(color), LV_PART_MAIN);
            lv_obj_set_style_text_color(id(pc_ha_text), lv_color_hex(color), LV_PART_MAIN);
          }

interval:
  # Apprendimento a bassa frequenza; non rallenta il gauge.
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return id(pc_learn_pending) &&
                (id(pc_ota) || !id(pc_learn_enabled).state ||
                 (uint32_t)(millis()-id(pc_learn_since_ms))>=
                   ((uint32_t)${learning_prompt_timeout_s})*1000u);
          then:
            - script.execute: pc_learn_close
      - if:
          condition:
            lambda: 'return !id(pc_learn_pending) && id(pc_learn_enabled).state;'
          then:
            - script.execute: pc_learn_tick
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: 'return id(pc_boot_active) && id(pc_boot_ui_ready) && !id(pc_ota);'
          then:
            - script.execute: pc_boot_tick
  # Prima misura valida eventualmente arrivata mentre la boot page era visibile.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(pc_haptic_zone)<0 && !id(pc_boot_active) && !id(pc_ota);'
          then:
            - script.execute: pc_haptic_check
  - interval: 1s
    then:
      - script.execute: pc_auto_tick
  - interval: 5s
    then:
      - script.execute: pc_status_refresh
  - interval: 1500ms
    then:
      - if:
          condition:
            lambda: 'return id(pc_dirty) && !id(pc_ota) && !id(pc_boot_active);'
          then:
            - script.execute: pc_refresh
  # Dopo 3 secondi dall'ULTIMA rotazione conferma la posizione e scrive le priorita'.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return id(pc_page)==1 && id(pc_prio_edit_slot)>=0 &&
                     !id(pc_boot_active) && !id(pc_ota) &&
                     (uint32_t)(millis()-id(pc_prio_last_move_ms))>=3000;
          then:
            - script.execute: pc_prio_commit
      - if:
          condition:
            lambda: 'return id(pc_page)==1 && id(pc_prio_edit_slot)>=0 && !id(pc_ota);'
          then:
            - lambda: |-
                const uint32_t elapsed=millis()-id(pc_prio_last_move_ms);
                const int seconds=elapsed>=3000 ? 0 : (int)((2999-elapsed)/1000)+1;
                char buf[24];
                snprintf(buf,sizeof(buf),"SALVATAGGIO TRA %d s",seconds);
                if (strcmp(lv_label_get_text(id(pc_prio_countdown)),buf)!=0)
                  lv_label_set_text(id(pc_prio_countdown),buf);
          else:
            - lambda: |-
                if (id(pc_page)==1 && strcmp(lv_label_get_text(id(pc_prio_countdown))," ")!=0)
                  lv_label_set_text(id(pc_prio_countdown)," ");
  # La mancata risposta NON autorizza MAI l'automatismo.
  # Chiude solo la modale, senza mutare pc_auto_allow_XX.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(pc_page)==6 && id(pc_prio_prompt_mode)!=0 &&
                !id(pc_ota) && (uint32_t)(millis()-id(pc_prio_prompt_since_ms))>=25000u;
          then:
            - script.execute:
                id: pc_prio_prompt_answer
                accept: false
  # IMPOSTAZIONI: salva solo dopo 3s senza rotazioni.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return id(pc_page)==4 && id(pc_auto_edit)>=0 && !id(pc_ota) &&
                     (uint32_t)(millis()-id(pc_auto_last_move_ms))>=3000u;
          then:
            - script.execute: pc_auto_settings_commit
  # COLORI: conferma solo dopo 3s senza rotazioni, come DISTACCO.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return id(pc_page)==3 && id(pc_color_edit_slot)>=0 &&
                     !id(pc_boot_active) && !id(pc_ota) &&
                     (uint32_t)(millis()-id(pc_color_last_move_ms))>=3000;
          then:
            - script.execute: pc_color_commit
      - if:
          condition:
            lambda: 'return id(pc_page)==3 && id(pc_color_edit_slot)>=0 && !id(pc_ota);'
          then:
            - lambda: |-
                const uint32_t elapsed=millis()-id(pc_color_last_move_ms);
                const int seconds=elapsed>=3000 ? 0 : (int)((2999-elapsed)/1000)+1;
                char buf[24];
                snprintf(buf,sizeof(buf),"SALVATAGGIO TRA %d s",seconds);
                if (strcmp(lv_label_get_text(id(pc_color_countdown)),buf)!=0)
                  lv_label_set_text(id(pc_color_countdown),buf);
          else:
            - lambda: |-
                if (id(pc_page)==3 && strcmp(lv_label_get_text(id(pc_color_countdown))," ")!=0)
                  lv_label_set_text(id(pc_color_countdown)," ");
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(pc_ota_error) && (uint32_t)(millis()-id(pc_ota_failed_ms))>=1800;'
          then:
            - lambda: |-
                id(pc_ota_error)=false;
                id(pc_ota)=false;
                id(pc_page)=0;
                id(pc_home_selection_explicit)=false;
                id(pc_last_activity_ms)=millis();
                id(pc_dirty)=true;
            - lvgl.page.show:
                id: power_page
                animation: NONE
            - script.execute: pc_refresh
  # Timeout UI: solo interazioni utente aggiornano pc_last_activity_ms.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return !id(pc_ota) && !id(pc_boot_active) && id(pc_page)!=0 &&
                     id(pc_page)!=5 && id(pc_page)!=6 && (uint32_t)(millis()-id(pc_last_activity_ms))>=60000;
          then:
            - if:
                condition:
                  lambda: 'return id(pc_prio_pending);'
                then:
                  - script.execute: pc_prio_commit
            - if:
                condition:
                  lambda: 'return id(pc_color_pending);'
                then:
                  - script.execute: pc_color_commit
            - if:
                condition:
                  lambda: 'return id(pc_auto_pending);'
                then:                  - script.execute: pc_auto_settings_commit
            - lambda: |-
                id(pc_prio_edit_slot)=-1;
                id(pc_color_edit_slot)=-1;
                id(pc_auto_edit)=-1;
                id(pc_page)=0;
                id(pc_home_selection_explicit)=false;
                id(pc_last_activity_ms)=millis();
                id(pc_dirty)=true;
            - lvgl.page.show:
                id: power_page
                animation: NONE
            - script.execute: pc_refresh
            - script.execute: pc_status_refresh

lvgl:
  id: pc_lvgl
  displays:
    - main_display
  touchscreens:
    - knob_touch
  log_level: WARN
  color_depth: 16
  # Buffer moderato: nessun canvas a pieno schermo da allocare.
  buffer_size: 25%
  on_boot:
    then:
      - lvgl.page.show:
          id: boot_page
          animation: NONE
      - lambda: |-
          id(pc_boot_start_ms) = millis();
          id(pc_boot_ticker_x) = 320;
          id(pc_boot_active) = true;
          id(pc_boot_ui_ready) = true;
          id(pc_boot_progress_last) = -1;
          id(pc_boot_step_last) = -1;
          id(pc_boot_ready_ms) = 0;
          id(pc_boot_handoff_pending) = false;
          // Precalcola la larghezza reale del testo per il ticker.
          lv_obj_update_layout(id(pc_boot_ticker));
  pages:
    # Prima pagina: si vede subito quando LVGL si inizializza.
    - id: boot_page
      skip: true
      scrollable: false
      bg_color: 0x020617
      bg_opa: COVER
      widgets:
        - label:
            text: "HackMyHome"
            align: TOP_MID
            y: 32
            text_font: montserrat_28
            text_color: 0x38BDF8
            clickable: false
        - label:
            text: "POWER CONTROL"
            align: TOP_MID
            y: 76
            text_font: montserrat_20
            text_color: 0xE2E8F0
            clickable: false
        - label:
            text: "I TUOI DISPOSITIVI"
            align: TOP_MID
            y: 113
            text_font: montserrat_12
            text_color: 0x94A3B8
            clickable: false
        # Finestra di ritaglio: una sola label scorre da destra a sinistra.
        - obj:
            x: 18
            y: 138
            width: 324
            height: 44
            bg_color: 0x0F172A
            border_width: 0
            radius: 13
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: pc_boot_ticker
                  x: 320
                  y: 11
                  text: "LAVATRICE   /   LAVASTOVIGLIE   /   MACCHINA CAFFE   /   FORNO   /   CLIMATIZZATORE   /   FRIGORIFERO   /   COLONNA SALA   /   RICARICA AUTO   /   "
                  text_font: montserrat_18
                  text_color: 0x38BDF8
                  clickable: false
        - label:
            id: pc_boot_status
            align: CENTER
            y: 26
            text: "AVVIO POWER CONTROL..."
            text_font: montserrat_14
            text_color: 0xE2E8F0
            clickable: false
        - bar:
            id: pc_boot_progress
            x: 43
            y: 244
            width: 274
            height: 12
            min_value: 0
            max_value: 100
            value: 0
            radius: 6
            bg_color: 0x1E293B
