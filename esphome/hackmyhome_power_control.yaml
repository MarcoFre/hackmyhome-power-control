                          "${appliance_12_switch}",
                          "${appliance_13_switch}",
                          "${appliance_14_switch}"
                        };
                        return controls[id(pc_selected)][0] != '\0' &&
                               strncmp(controls[id(pc_selected)], "switch.pc_non_configurato_", 26) != 0;
