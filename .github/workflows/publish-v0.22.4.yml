name: Publish v0.22.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.22.4 >/dev/null 2>&1; then
            echo "Release v0.22.4 already exists."
          else
            gh release create v0.22.4 \
              --target "${GITHUB_SHA}" \
              --title "HackMyHome Power Control v0.22.4" \
              --notes-file RELEASE_NOTES.md
          fi
